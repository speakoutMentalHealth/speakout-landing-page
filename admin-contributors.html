<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Contributors | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--goldSoft:#fff4df;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--ink:#111827;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10);--r:22px}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:1000}.nav-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;object-fit:contain}.brand h2{margin:0;color:var(--blue);font-size:1.05rem}.brand p{margin:0;color:#d98200;font-size:.65rem;font-weight:900}.nav-links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 14px;border-radius:999px;border:0;font-weight:900;cursor:pointer;font-size:.84rem}.primary{background:var(--blue);color:#fff}.softBtn{background:var(--soft);color:var(--blue)}.gold{background:var(--gold);color:#241300}.dark{background:var(--navy);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}.danger{background:var(--redSoft);color:var(--red)}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:56px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.kicker{background:rgba(255,255,255,.14)}.label{background:var(--soft);color:var(--blue);margin-bottom:14px}h1,h2,h3{line-height:1.05;letter-spacing:-.04em}h1{font-size:clamp(2.3rem,6vw,5rem);margin:16px 0}.hero p{max-width:780px;line-height:1.65;color:rgba(255,255,255,.88)}section{padding:52px 0}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.input,.select,.textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fbfdff}.textarea{min-height:120px;resize:vertical}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.warn{background:var(--goldSoft);color:#704800}.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.68rem;font-weight:900;text-transform:capitalize}.pill.green{background:var(--greenSoft);color:var(--green)}.pill.gold{background:var(--goldSoft);color:#8a5600}.pill.red{background:var(--redSoft);color:var(--red)}.app-item{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;margin-top:12px}.app-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.footer{background:#061126;color:rgba(255,255,255,.75);padding:36px 0;margin-top:30px}.small{color:var(--muted);line-height:1.6;font-size:.92rem}
@media(max-width:900px){.g3,.g2,.row{grid-template-columns:1fr}.nav-links{display:none}.btn{width:100%;border-radius:14px}}
</style></head><body><header class="nav"><div class="container nav-inner">
<a class="brand" href="portal.html"><img src="logo.png" alt="SpeakOut"><div><h2>SpeakOut</h2><p>Learning Portal</p></div></a>
<nav class="nav-links"><a class="btn softBtn" href="portal.html">Portal</a><a class="btn softBtn" href="e-library.html">E-Library</a><a class="btn softBtn" href="speakhub.html">SpeakHub</a><a class="btn softBtn" href="contributor.html">Contribute</a><a class="btn dark" href="auth.html">Login</a></nav>
</div></header>
<main>
<section class="hero"><div class="container"><span class="kicker">Admin Review</span><h1>Contributor Applications</h1><p>Review author and trainer applications. Approve verified contributors before content publication.</p></div></section>

<section><div class="container">
<div class="panel">
<span class="label">Applications</span>
<div id="loading" class="notice">Checking admin access...</div>
<div id="appList"></div>
</div>
</div></section>
</main><footer class="footer"><div class="container">SpeakOut Portal • <a href="portal.html">Back to Portal</a></div></footer>
<script type="module" src="auth-guard.js"></script>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { collection, getDocs, doc, getDoc, updateDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const loading=document.getElementById("loading"), appList=document.getElementById("appList");
let admin=false;
async function isAdmin(u){if(!u)return false;const s=await getDoc(doc(db,"users",u.uid));return s.exists()&&s.data().role==="admin"}
function badge(s){let cls=s==="approved"?"green":s==="rejected"?"red":"gold";return `<span class="pill ${cls}">${s||"pending"}</span>`}
async function approve(id,data){
 await updateDoc(doc(db,"contributorApplications",id),{status:"approved",updatedAt:serverTimestamp()});
 const contributorId=(data.email||id).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
 await setDoc(doc(db,"contributors",contributorId),{fullName:data.fullName||"",email:data.email||"",phone:data.phone||"",contributorType:data.contributorType||"",organization:data.organization||"",expertise:data.expertise||"",bio:data.bio||"",status:"approved",sourceApplicationId:id,createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
 await loadApps();
}
async function reject(id){await updateDoc(doc(db,"contributorApplications",id),{status:"rejected",updatedAt:serverTimestamp()});await loadApps();}
async function loadApps(){
 const snap=await getDocs(collection(db,"contributorApplications"));
 const apps=[];snap.forEach(d=>apps.push({id:d.id,...d.data()}));
 apps.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 loading.style.display="none";
 appList.innerHTML=apps.map(a=>`<article class="app-item">
 <h3>${a.fullName||"Unnamed Applicant"}</h3>
 <div class="pills">${badge(a.status)}<span class="pill">${a.contributorType||""}</span><span class="pill">${a.expertise||""}</span></div>
 <p><strong>Email:</strong> ${a.email||""}<br><strong>Phone:</strong> ${a.phone||""}<br><strong>Organization:</strong> ${a.organization||""}</p>
 <p><strong>Bio:</strong><br>${a.bio||""}</p>
 <p><strong>Proposal:</strong><br>${a.proposal||""}</p>
 ${a.sampleUrl?`<p><strong>Sample:</strong> <a href="${a.sampleUrl}" target="_blank">${a.sampleUrl}</a></p>`:""}
 <div class="app-actions">
 <button class="btn primary" data-approve="${a.id}">Approve</button>
 <button class="btn danger" data-reject="${a.id}">Reject</button>
 </div>
 </article>`).join("") || '<div class="notice">No applications yet.</div>';
 appList.querySelectorAll("[data-approve]").forEach(btn=>btn.onclick=()=>{const app=apps.find(x=>x.id===btn.dataset.approve);approve(btn.dataset.approve,app)});
 appList.querySelectorAll("[data-reject]").forEach(btn=>btn.onclick=()=>reject(btn.dataset.reject));
}
onAuthStateChanged(auth,async u=>{admin=await isAdmin(u);if(!admin){loading.textContent="Access denied. Admin role required.";loading.className="notice bad";return}loading.textContent="Admin verified. Loading applications...";await loadApps()});
</script></body></html>
