<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshops | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--goldSoft:#fff4df;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}.brand h2{margin:0;color:var(--blue);font-size:1.05rem}.brand p{margin:0;color:#d98200;font-size:.62rem;font-weight:900}.links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer;min-height:40px}.primary{background:var(--blue);color:#fff}.soft{background:var(--soft);color:var(--blue)}.gold{background:var(--gold);color:#241300}.dark{background:var(--navy);color:#fff}.danger{background:var(--redSoft);color:var(--red)}.success{background:var(--greenSoft);color:var(--green)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:52px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.72rem;font-weight:900;text-transform:uppercase}.kicker{background:rgba(255,255,255,.14)}.label{background:var(--soft);color:var(--blue);margin-bottom:12px}h1{font-size:clamp(2rem,5vw,4.6rem);line-height:1.05;margin:14px 0}h2,h3{line-height:1.05;color:var(--navy)}.hero p{max-width:850px;color:rgba(255,255,255,.88);line-height:1.65}section{padding:36px 0}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}.card p,.panel p{color:var(--muted);line-height:1.6}.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900;margin-bottom:16px}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.warn{background:var(--goldSoft);color:#704800}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.75rem;font-weight:900;margin:3px}.approved,.active{background:var(--greenSoft);color:var(--green)}.premium{background:var(--goldSoft);color:#704800}.pending,.pending_school_approval{background:var(--goldSoft);color:#704800}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:11px;font:inherit;background:#fbfdff}textarea{min-height:95px;resize:vertical}.footer{background:#061126;color:rgba(255,255,255,.75);padding:34px 0;margin-top:30px}@media(max-width:900px){.g4,.g3,.g2,.form-grid{grid-template-columns:1fr}.links{display:none}.btn{width:100%;border-radius:14px}}
</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><img src="logo.png"><div><h2>SpeakOut</h2><p>Workshops</p></div></a><nav class="links" id="roleNav"></nav></div></header><main><section class="hero"><div class="container"><span class="kicker">Workshops & Seminars</span><h1>Upcoming Workshops</h1><p>See workshops, seminars and activities relevant to your role and school.</p></div></section><section><div class="container"><div id="statusBox" class="notice">Loading workshops...</div><div id="workshopGrid" class="grid g3"></div></div></section></main><footer class="footer"><div class="container">SpeakOut Mental Health Outreach</div></footer><script type="module">import { requireRoles, renderRoleNav } from "./launch-role-guard.js";import { db } from "./firebase-config.js";
import { collection, getDocs, query, where, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

window.loadWorkshops = async function(profile){
 const box=document.getElementById("workshopGrid");
 const status=document.getElementById("statusBox");
 try{
   const schoolId=profile.schoolId||"";
   const role=(profile.role||"").toLowerCase();
   const snap=await getDocs(query(collection(db,"workshops"),where("status","==","active")));
   let items=[];
   snap.forEach(d=>{
     const w={id:d.id,...d.data()};
     const aud=(w.audience||"all").toLowerCase();
     const sameSchool=!w.schoolId || w.schoolId===schoolId || w.schoolId==="all";
     const rightAudience=aud==="all"||aud===role||aud===role+"s";
     if(sameSchool && rightAudience) items.push(w);
   });
   box.innerHTML=items.map(w=>`<article class="card"><span class="pill active">${w.audience||"all"}</span><h3>${w.title||"Workshop"}</h3><p>${w.description||"No description yet."}</p><p><b>Date:</b> ${w.date||"TBA"} ${w.time||""}</p><p><b>Location:</b> ${w.location||"TBA"}</p></article>`).join("")||"<div class='notice warn'>No upcoming workshop for your role yet.</div>";
   status.textContent="Workshops loaded."; status.className="notice ok";
 }catch(e){console.error(e);status.textContent="Could not load workshops.";status.className="notice bad";}
}

window.createWorkshop = async function(profile){
 const payload={
   title:title.value.trim(),
   description:description.value.trim(),
   date:date.value,
   time:time.value,
   location:locationField.value.trim(),
   audience:audience.value,
   schoolId:profile.schoolId||"",
   schoolCode:profile.schoolCode||"",
   status:"active",
   createdBy:profile.uid,
   createdAt:serverTimestamp()
 };
 await addDoc(collection(db,"workshops"),payload);
}
window.pageReady=async(user,profile)=>{await window.loadWorkshops(profile)};requireRoles(["student","parent","teacher","school_admin"], async (user, profile)=>{renderRoleNav(profile,"Workshops"); if(window.pageReady) window.pageReady(user,profile);});</script></body></html>
