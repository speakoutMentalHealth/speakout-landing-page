<body><a class="skip-link" href="#main-content">Skip to main content</a>
<header class="nav"><div class="container nav-inner">
<a class="brand" href="../dashboards/student/index.html"><img alt="SpeakOut" decoding="async" fetchpriority="high" height="1254" loading="eager" src="../images/logo.png" width="1254"/><div>SpeakOut<small>Portal Dashboard</small></div></a>

<main id="main-content">
<section class="hero"><div class="container"><span class="kicker">Approved Portal Access</span><h1>My E-Library</h1><p>Access approved books, guides and learning resources.</p></div></section>
<section><div class="container grid g3"><div class="card metric"><strong id="total">0</strong><span>Books</span></div><div class="card metric"><strong id="mental">0</strong><span>Mental Health</span></div><div class="card metric"><strong id="guides">0</strong><span>Guides</span></div></div></section>
<section><div class="container"><div class="panel"><span class="label">E-Library</span><div class="controls"><input id="search" placeholder="Search books..."/><select id="category"><option value="all">All Categories</option></select><button class="btn ghost" id="reset">Reset</button></div></div><div class="grid g3" id="cards" style="margin-top:14px"></div></div></section>
</main>
<footer class="footer"><div class="container">SpeakOut Portal • <a href="../index.html">Back Home</a></div></footer>
<script type="module">
import { SO } from "../js/dashboard-shared.js";

let books=[];async function load(){books=await SO.getAll("books");total.textContent=SO.num(books.length);mental.textContent=SO.num(books.filter(b=>b.category==="Mental Health").length);guides.textContent=SO.num(books.filter(b=>String(b.category||"").includes("Guide")).length);[...new Set(books.map(b=>b.category).filter(Boolean))].forEach(c=>category.innerHTML+=`<option>${c}</option>`);render()}
function render(){let q=search.value.toLowerCase();let out=books.filter(b=>(category.value==="all"||b.category===category.value)&&`${b.title} ${b.author} ${b.category}`.toLowerCase().includes(q));cards.innerHTML=out.length?out.map(b=>`<article class="card"><div class="icon">📚</div><span class="label">${SO.safe(b.category)}</span><h2>${SO.safe(b.title)}</h2><p>${SO.safe(b.description)}</p><p><strong>${SO.safe(b.author)}</strong></p><a class="btn primary" href="${b.bookUrl||'#'}" target="_blank">Open Book</a></article>`).join(""):`<div class="notice"><h3>No books found.</h3><p>Admin needs to add books from admin-books.html.</p></div>`}
search.oninput=render;category.onchange=render;reset.onclick=()=>{search.value="";category.value="all";render()};load();

</script>
<script src="../js/protected-page-guard.js" type="module"></script>
</body></html>
