<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Admin Impact Stats</title><link href="../logo.png" rel="icon"/><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/><style>
:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--green:#0f8f6f;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line)}.nav-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--blue)}.brand img{width:44px;height:44px;object-fit:contain}.links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:10px 15px;border-radius:999px;border:0;font-weight:900;cursor:pointer;text-align:center}.primary{background:var(--blue);color:#fff}.dark{background:var(--navy);color:#fff}.gold{background:var(--gold);color:#241300}.soft{background:var(--soft);color:var(--blue)}.light{background:#fff;color:var(--navy)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:58px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.kicker{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}.label{background:var(--soft);color:var(--blue);margin-bottom:12px}h1,h2,h3{line-height:1.05;letter-spacing:-.045em}h1{font-size:clamp(2.4rem,6vw,5rem);margin:16px 0}h2{font-size:clamp(2rem,4vw,3.7rem);color:var(--navy);margin:0 0 12px}.hero p{max-width:820px;color:rgba(255,255,255,.88);line-height:1.65}section{padding:56px 0}.section-title{text-align:center;max-width:880px;margin:0 auto 34px}.section-title p{color:var(--muted);line-height:1.65}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px}.card p,.panel p{color:var(--muted);line-height:1.62}.stat strong{display:block;font-size:2.4rem;color:var(--blue)}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-weight:900;font-size:.75rem}.media-frame{width:100%;height:320px;border:0;border-radius:20px;background:#061126}.audio-player{width:100%;margin:10px 0}.footer{background:#061126;color:rgba(255,255,255,.75);padding:34px 0;margin-top:30px}.footer a{color:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:11px;font:inherit;background:#fbfdff}textarea{min-height:110px;resize:vertical}.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900;margin:12px 0}.ok{background:#e9fbf5;color:var(--green)}.bad{background:#fee2e2;color:#991b1b}.table-wrap{overflow:auto}.table{width:100%;border-collapse:separate;border-spacing:0 10px}.table th{text-align:left;color:var(--muted);font-size:.8rem;text-transform:uppercase}.table td,.table th{padding:10px}.row{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.actions{display:flex;gap:8px;flex-wrap:wrap}.admin-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);height:max-content}.side a{display:block;margin:8px 0}@media(max-width:900px){.g4,.g3,.g2,.form-grid,.admin-layout{grid-template-columns:1fr}.links{display:none}.btn{width:100%;border-radius:14px}.media-frame{height:230px}}
</style><link href="css/portal-ui.css" rel="stylesheet"/>
<link href="css/production-ready.css" rel="stylesheet"/><script defer="True" src="production-ready.js"></script><meta content="#123f91" name="theme-color"/></head><body><a class="skip-link" href="#main-content">Skip to main content</a><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html"><img alt="SpeakOut logo" decoding="async" fetchpriority="high" loading="eager" src="../logo.png"/><span>SpeakOut Admin</span></a></div></header><main id="main-content"><section class="hero"><div class="container"><span class="kicker">Admin CMS</span><h1>Admin Impact Stats</h1><p>Firestore collection: <strong>homepageStats</strong></p></div></section><section><div class="container admin-layout"><aside class="side"><h3>Admin Pages</h3><a class="btn soft" href="admin-media.html">Media</a><a class="btn soft" href="admin-podcast.html">Podcasts</a><a class="btn soft" href="admin-videos.html">Videos</a><a class="btn soft" href="admin-reports.html">Reports</a><a class="btn soft" href="admin-impact.html">Impact</a><a class="btn soft" href="admin-partners.html">Partners</a></aside><div><div class="notice" id="statusBox">Loading...</div><div class="panel"><span class="label">Create / Update</span><form class="form-grid" id="cmsForm"><input id="title" placeholder="Metric Title"/><input id="description" placeholder="Description"/><input id="value" placeholder="Value e.g. 10000"/><input id="suffix" placeholder="Suffix e.g. +"/><input id="category" placeholder="Category"/><select id="status"><option value="active">active</option><option value="draft">draft</option><option value="hidden">hidden</option></select><input id="order" placeholder="Order" type="number"/><button class="btn primary" type="submit">Save Record</button></form></div><div class="panel" style="margin-top:18px"><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Status</th><th>Order</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div></section></main><script type="module">
import { db } from "../firebase-config.js";
import { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const COL="homepageStats", rows=document.getElementById("rows"), form=document.getElementById("cmsForm"), statusBox=document.getElementById("statusBox");let editingId=null, ITEMS=[];const val=id=>document.getElementById(id)?.value?.trim()||"";function show(m,c=""){statusBox.textContent=m;statusBox.className="notice "+c}async function load(){try{const snap=await getDocs(query(collection(db,COL),orderBy("order","asc")));ITEMS=[];snap.forEach(d=>ITEMS.push({id:d.id,...d.data()}));render();show("Loaded.","ok")}catch(e){console.error(e);show("Could not load. Check Firestore rules and firebase-config.js.","bad")}}function render(){rows.innerHTML=ITEMS.map(i=>`<tr class="row"><td>${i.title||i.name||i.label||"Untitled"}</td><td>${i.status||"active"}</td><td>${i.order||0}</td><td><div class="actions"><button class="btn soft" data-edit="${i.id}">Edit</button><button class="btn dark" data-hide="${i.id}">Hide</button><button class="btn gold" data-del="${i.id}">Delete</button></div></td></tr>`).join("")||"<tr><td colspan='4'>No records yet.</td></tr>";rows.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const i=ITEMS.find(x=>x.id===b.dataset.edit);editingId=i.id;document.getElementById("title").value=i.title||"";document.getElementById("description").value=i.description||"";document.getElementById("value").value=i.value||"";document.getElementById("suffix").value=i.suffix||"";document.getElementById("category").value=i.category||"";document.getElementById("status").value=i.status||"active";document.getElementById("order").value=i.order||0;show("Editing record.","ok")});rows.querySelectorAll("[data-hide]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,COL,b.dataset.hide),{status:"hidden",updatedAt:serverTimestamp()});load()});rows.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this record?")){await deleteDoc(doc(db,COL,b.dataset.del));load()}})}form.onsubmit=async e=>{e.preventDefault();const payload={title: val("title"),description: val("description"),value: val("value"),suffix: val("suffix"),category: val("category"),status:val("status")||"active",order:Number(val("order")||0),updatedAt:serverTimestamp()};if(editingId){await updateDoc(doc(db,COL,editingId),payload);editingId=null}else{payload.createdAt=serverTimestamp();await addDoc(collection(db,COL),payload)}form.reset();load()};load();
</script><script defer="" src="portal-ui.js"></script>
</body></html>
