<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Course Player | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{background:#fff;border-bottom:1px solid var(--line)}.nav-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}.brand h2{margin:0;color:var(--blue)}.btn{display:inline-flex;padding:10px 14px;border-radius:999px;font-weight:900;border:0}.primary{background:var(--blue);color:#fff}.gold{background:var(--gold);color:#241300}.softBtn{background:var(--soft);color:var(--blue)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:50px 0}h1{font-size:clamp(2rem,5vw,4rem)}section{padding:45px 0}.loading,.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900}.lesson-layout{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel,.reader{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}.reader{line-height:1.75}.lesson-list{display:grid;gap:10px}.lesson-btn{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer;font-weight:800}.lesson-btn.active{background:var(--blue);color:#fff}.footer{background:#061126;color:#fff;padding:30px 0}@media(max-width:900px){.lesson-layout{grid-template-columns:1fr}}</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="portal.html"><img src="logo.png"><h2>SpeakOut</h2></a><a class="btn softBtn" href="speakhub.html">SpeakHub</a></div></header><main><section class="hero"><div class="container"><h1 id="heroTitle">Loading...</h1><p id="heroDesc"></p><p><a id="detailsLink" class="btn gold" href="speakhub.html">Course Details</a></p></div></section><section><div class="container"><div id="loading" class="loading">Loading course...</div><div id="player" class="lesson-layout" style="display:none"><aside class="panel"><h3>Lessons</h3><div id="lessonList" class="lesson-list"></div></aside><article id="lessonContent" class="reader"></article></div></div></section></main><footer class="footer"><div class="container">SpeakOut Portal</div></footer><script type="module" src="auth-guard.js"></script><script type="module" src="protected-page-guard.js"></script><script type="module">import{db}from"./firebase-config.js";import{doc,getDoc,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const p=new URLSearchParams(location.search),id=p.get("id"),preview=p.get("preview")==="1",loading=document.getElementById("loading"),player=document.getElementById("player"),lessonList=document.getElementById("lessonList"),lessonContent=document.getElementById("lessonContent");let lessons=[];function showLesson(idx){const l=lessons[idx];document.querySelectorAll(".lesson-btn").forEach(b=>b.classList.remove("active"));document.querySelector(`[data-idx="${idx}"]`)?.classList.add("active");lessonContent.innerHTML=`<h1>${l.title||"Lesson"}</h1>${l.contentHtml||"<p>No lesson content yet.</p>"}${l.activity?`<h2>Activity</h2><p>${l.activity}</p>`:""}${l.quizPrompt?`<h2>Reflection / Quiz</h2><p>${l.quizPrompt}</p>`:""}`}async function load(){if(!id){loading.textContent="No course ID provided.";return}try{const s=await getDoc(doc(db,"courses",id));if(!s.exists()){loading.textContent="Course not found.";return}const c={id:s.id,...s.data()};heroTitle.textContent=c.title||"Course";heroDesc.textContent=c.shortDescription||c.description||"";detailsLink.href=`course-details.html?id=${encodeURIComponent(c.id)}`;if((c.accessType||"free")!=="free"&&!preview){lessonContent.innerHTML=`<h1>${c.title}</h1><p>This is a premium course. Payment unlock will be connected later.</p>`;lessonList.innerHTML=`<a class="btn gold" href="course-details.html?id=${encodeURIComponent(c.id)}">Return to Details</a>`;loading.style.display="none";player.style.display="grid";return}const ls=await getDocs(query(collection(db,"courseLessons"),where("courseId","==",id)));lessons=[];ls.forEach(d=>lessons.push({id:d.id,...d.data()}));lessons.sort((a,b)=>(a.order||0)-(b.order||0));if(!lessons.length)lessons=[{title:"Welcome",contentHtml:"<p>No lessons have been added yet. Admin should add course lessons.</p>"}];lessonList.innerHTML=lessons.map((l,i)=>`<button class="lesson-btn" data-idx="${i}" type="button">${i+1}. ${l.title||"Lesson"}</button>`).join("");lessonList.querySelectorAll(".lesson-btn").forEach(btn=>btn.onclick=()=>showLesson(Number(btn.dataset.idx)));loading.style.display="none";player.style.display="grid";showLesson(0)}catch(e){console.error(e);loading.textContent="Failed to load course."}}load();</script></body></html>
