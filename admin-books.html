<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Books | SpeakOut</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#07152b;--blue:#0a5fbf;--blue2:#074f9f;--soft:#eaf3ff;--gold:#f4a21c;--goldSoft:#fff4df;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--ink:#111827;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.1);--r:22px}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:1000}.nav-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;object-fit:contain}.brand h2{margin:0;color:var(--blue);font-size:1.05rem}.brand p{margin:0;color:#d98200;font-size:.65rem;font-weight:900}.nav-links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 14px;border-radius:999px;border:0;font-weight:900;cursor:pointer;font-size:.84rem}.primary{background:var(--blue);color:#fff}.softBtn{background:var(--soft);color:var(--blue)}.gold{background:var(--gold);color:#241300}.dark{background:var(--navy);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:56px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.kicker{background:rgba(255,255,255,.14)}.label{background:var(--soft);color:var(--blue);margin-bottom:14px}h1,h2,h3{line-height:1.05;letter-spacing:-.04em}h1{font-size:clamp(2.3rem,6vw,5rem);margin:16px 0}.hero p{max-width:760px;line-height:1.65;color:rgba(255,255,255,.88)}section{padding:52px 0}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.controls{background:#fff;border-bottom:1px solid var(--line)}.controls-grid{display:grid;grid-template-columns:1.2fr .7fr .7fr .6fr;gap:10px}.input,.select,.textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fbfdff}.textarea{min-height:140px}.cover{height:180px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:16px;display:flex;align-items:flex-end;position:relative;overflow:hidden;margin-bottom:12px}.cover img,.big-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover strong,.big-cover strong{position:relative;z-index:2;text-shadow:0 4px 18px rgba(0,0,0,.4)}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.pill{padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.68rem;font-weight:900;text-transform:capitalize}.pill.green{background:var(--greenSoft);color:var(--green)}.pill.gold{background:var(--goldSoft);color:#8a5600}.loading,.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.empty{display:none;background:var(--goldSoft);color:#704800}.book-head{display:grid;grid-template-columns:280px 1fr;gap:24px}.big-cover{min-height:360px;border-radius:26px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:24px;display:flex;align-items:flex-end;position:relative;overflow:hidden}.reader{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(18px,4vw,42px);line-height:1.75}.reader h1,.reader h2,.reader h3{color:var(--navy)}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;margin-top:10px}.footer{background:#061126;color:rgba(255,255,255,.75);padding:36px 0;margin-top:30px}
@media(max-width:900px){.g3,.g2,.controls-grid,.book-head,.row{grid-template-columns:1fr}.nav-links{display:none}.big-cover{min-height:260px}.btn{width:100%;border-radius:14px}}
</style>
<link rel="stylesheet" href="css/portal-ui.css">
</head><body>
<header class="nav"><div class="container nav-inner">
<a class="brand" href="portal.html"><img src="logo.png" alt="SpeakOut"><div><h2>SpeakOut</h2><p>Learning Portal</p></div></a>
<nav class="nav-links">
<a class="btn softBtn" href="portal.html">Portal</a>
<a class="btn softBtn" href="e-library.html">E-Library</a>
<a class="btn softBtn" href="speakhub.html">SpeakHub</a>
<a class="btn dark" href="auth.html">Login</a>
</nav></div></header>

<main><section class="hero"><div class="container"><span class="kicker">Admin Publishing</span><h1>Manage E-Library Books</h1><p>Add free or premium books, set price, reader content, PDF links and publish status.</p></div></section>
<section><div class="container grid g2"><div class="panel"><span class="label">Add / Update Book</span><form id="bookForm" class="form"><input id="bookId" class="input" placeholder="Book ID / slug" required><div class="row"><input id="title" class="input" placeholder="Title" required><input id="author" class="input" value="SpeakOut Mental Health Outreach" placeholder="Author"></div><div class="row"><select id="category" class="select"><option value="mental-health">Mental Health</option><option value="leadership">Leadership</option><option value="career">Career</option><option value="ngo">NGO</option><option value="technology">Technology</option><option value="children">Children</option><option value="parenting">Parenting</option></select><select id="accessType" class="select"><option value="free">Free</option><option value="paid">Premium / Paid</option></select></div><div class="row"><input id="price" class="input" type="number" value="0" min="0" placeholder="Price"><input id="currency" class="input" value="₦" placeholder="Currency"></div><input id="coverUrl" class="input" placeholder="Cover image URL/path"><input id="downloadUrl" class="input" placeholder="PDF download URL/path"><textarea id="shortDescription" class="textarea" placeholder="Short description"></textarea><textarea id="fullDescription" class="textarea" placeholder="Full description"></textarea><textarea id="keyLessons" class="textarea" placeholder="Key lessons, one per line"></textarea><textarea id="tags" class="textarea" placeholder="Tags, comma separated"></textarea><textarea id="readerHtml" class="textarea" placeholder="Full reader HTML / mini-book content"></textarea><div class="row"><select id="status" class="select"><option value="active">Active</option><option value="draft">Draft</option><option value="archived">Archived</option></select><select id="featured" class="select"><option value="true">Featured</option><option value="false">Not Featured</option></select></div><button class="btn primary" type="submit">Save Book</button><div id="statusBox" class="notice" style="display:none"></div></form></div><div class="panel"><span class="label">Existing Books</span><div id="loading" class="loading">Loading books...</div><div id="adminList"></div></div></div></section></main><footer class="footer"><div class="container">SpeakOut Portal • <a href="portal.html">Back to Portal</a></div></footer>
<script type="module" src="auth-guard.js"></script>
<script type="module">
import { auth, db } from "./firebase-config.js"; import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js"; import { collection,getDocs,doc,getDoc,setDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const form=document.getElementById("bookForm"), box=document.getElementById("statusBox"), list=document.getElementById("adminList"), loading=document.getElementById("loading");let admin=false;const show=(m,c="ok")=>{box.style.display="block";box.className="notice "+c;box.textContent=m}, val=id=>document.getElementById(id).value.trim(), slug=s=>(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function isAdmin(u){if(!u)return false;const s=await getDoc(doc(db,"users",u.uid));return s.exists()&&s.data().role==="admin"}
function fill(i){bookId.value=i.id||"";title.value=i.title||"";author.value=i.author||"";category.value=i.category||"mental-health";accessType.value=i.accessType||"free";price.value=i.price||0;currency.value=i.currency||"₦";coverUrl.value=i.coverUrl||"";downloadUrl.value=i.downloadUrl||"";shortDescription.value=i.shortDescription||i.description||"";fullDescription.value=i.fullDescription||"";keyLessons.value=Array.isArray(i.keyLessons)?i.keyLessons.join("\n"):"";tags.value=Array.isArray(i.tags)?i.tags.join(", "):"";readerHtml.value=i.readerHtml||i.contentHtml||"";status.value=i.status||"active";featured.value=i.featured===true?"true":"false";scrollTo({top:0,behavior:"smooth"})}
async function loadBooks(){const snap=await getDocs(collection(db,"books"));const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));loading.style.display="none";list.innerHTML=arr.map(b=>`<div class="admin-item"><div><strong>${b.title||b.id}</strong><br><small>${b.category||""} • ${b.accessType||"free"} • ${b.status||"active"}</small></div><button class="btn softBtn" data-id="${b.id}" type="button">Edit</button></div>`).join("")||'<div class="notice">No books yet.</div>';list.querySelectorAll("button[data-id]").forEach(btn=>btn.onclick=async()=>{const s=await getDoc(doc(db,"books",btn.dataset.id));if(s.exists())fill({id:s.id,...s.data()})})}
onAuthStateChanged(auth,async u=>{admin=await isAdmin(u);if(!admin){show("Access denied. Admin role required.","bad");form.querySelectorAll("input,select,textarea,button").forEach(e=>e.disabled=true);loading.textContent="Admin role required.";return}show("Admin verified. You can save books.","ok");await loadBooks()});
form.onsubmit=async e=>{e.preventDefault();if(!admin)return;const id=slug(val("bookId")||val("title"));if(!id)return show("Book ID or title required.","bad");const item={title:val("title"),slug:id,author:val("author")||"SpeakOut Mental Health Outreach",category:val("category"),accessType:val("accessType"),price:Number(val("price")||0),currency:val("currency")||"₦",coverUrl:val("coverUrl"),downloadUrl:val("downloadUrl"),shortDescription:val("shortDescription"),fullDescription:val("fullDescription"),keyLessons:val("keyLessons").split("\n").map(x=>x.trim()).filter(Boolean),tags:val("tags").split(",").map(x=>x.trim()).filter(Boolean),readerHtml:val("readerHtml"),status:val("status"),featured:val("featured")==="true",readOnline:true,downloadEnabled:!!val("downloadUrl"),updatedAt:serverTimestamp()};try{await setDoc(doc(db,"books",id),item,{merge:true});show("Book saved successfully.","ok");await loadBooks()}catch(err){console.error(err);show(err.message||"Failed to save.","bad")}};
</script><script src="portal-ui.js" defer></script>
</body></html>
