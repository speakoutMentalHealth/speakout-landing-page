<body class="tv-ios youth-watch-page">
<header class="ios-topbar youth-topbar">
  <div class="tv-container ios-topbar-inner">
    <a class="ios-brand" href="tv.html"><img src="images/logo.png" alt="SpeakOut"><span>SpeakOut <b>TV</b></span></a>
    <a class="ios-icon-btn" href="tv-search.html" aria-label="Search SpeakOut TV"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.5 15.5 4 4"/></svg></a>
  </div>
</header>

<main>
<section class="tv-container watch-experience">
  <a class="watch-back" href="tv.html#watch">← Back to Watch</a>

  <div class="watch-player-shell">
    <div class="watch-player" id="watchPlayer" aria-live="polite">
      <div class="watch-loading"><span></span><strong>Loading episode…</strong></div>
    </div>
  </div>

  <article class="watch-details">
    <div class="watch-copy-main">
      <a class="watch-series-pill" id="watchSeriesLink" href="tv-search.html"><span id="watchShow">SPEAKOUT TV</span> <b>›</b></a>
      <h1 id="watchTitle">Watch</h1>
      <p id="watchDescription"></p>
      <div class="episode-meta" id="episodeMeta"></div>
    </div>

    <div class="watch-actions" aria-label="Episode actions">
      <button class="watch-action primary" id="shareEpisode" type="button">Share</button>
      <button class="watch-action" id="saveEpisode" type="button" aria-pressed="false">＋ Save</button>
    </div>
    <p class="share-status" id="shareStatus" role="status" aria-live="polite"></p>
  </article>
</section>

<section class="tv-container up-next-section" id="upNextSection" hidden>
  <div class="up-next-card">
    <div>
      <span>UP NEXT</span>
      <h2 id="nextTitle">Another episode</h2>
      <p id="nextDescription"></p>
    </div>
    <a id="nextEpisodeLink" class="tv-action-btn primary" href="#">Watch next ▶</a>
  </div>
</section>

<section class="tv-container watch-related-section" id="relatedSection" hidden>
  <div class="youth-section-head">
    <div><span>KEEP EXPLORING</span><h2>Related to This</h2><p>More SpeakOut content connected by series or topic.</p></div>
    <a id="allSeriesLink" href="tv-search.html">Explore series</a>
  </div>
  <div class="content-rail" id="relatedRail"></div>
</section>

</main>
