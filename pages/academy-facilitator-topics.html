<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facilitator Topic Explorer | SpeakOut Academy</title><style>body{font:1rem/1.65 system-ui,sans-serif;background:#f3f7fb;color:#173b55;margin:0}main{max-width:900px;margin:auto;padding:2rem 1rem}header{background:#154f78;color:#fff;padding:2rem;border-radius:16px}article{background:#fff;border:1px solid #d4e0eb;border-radius:14px;padding:1.4rem;margin:1rem 0}a{color:#075c8e}header a{color:#fff}a:focus-visible{outline:3px solid orange}small{display:block;color:#445e6c}h1{font-size:clamp(1.8rem,4vw,2.7rem)}</style></head><body><main><header><p><a href="academy.html">SpeakOut Academy</a> / <a href="academy-source-resources.html">Resource catalogue</a></p><h1>Facilitator topic explorer</h1><p>Explore identified Ignite teaching topics by subject and class. These are references for planning, not SpeakOut-approved or imported lesson materials.</p></header><section aria-label="Identified facilitator topics" id="topics"><p>Loading topic references…</p></section><p><a href="academy-subject-discovery.html">Browse all subject areas →</a></p></main><script>fetch('../data/academy-source-resources.json').then(r=>{if(!r.ok)throw Error('Unavailable');return r.json()}).then(d=>{const topics=(d.resources||[]).filter(x=>x.contentKind==='facilitator-topic'&&x.source==='Ignite'&&x.publicationStatus==='external-link-only');const target=document.getElementById('topics');target.replaceChildren();if(!topics.length){target.textContent='No individual topic references are currently available.';return}for(const t of topics){const article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),a=document.createElement('a'),note=document.createElement('small');h.textContent=t.title;p.textContent=t.subject+' · '+t.level;a.href=t.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View source teaching topic ↗';note.textContent='Source: Ignite · External reference · Review pending · Reuse rights not cleared';article.append(h,p,a,note);target.append(article)}}).catch(()=>{document.getElementById('topics').textContent='Topic references are temporarily unavailable.'});</script><script type="module" src="../js/account-controls.js"></script>
</body></html>
