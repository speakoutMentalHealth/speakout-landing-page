<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Courses | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{background:#fff;border-bottom:1px solid var(--line)}.nav-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}.brand h2{margin:0;color:var(--blue)}.btn{display:inline-flex;padding:10px 14px;border-radius:999px;font-weight:900;border:0;cursor:pointer}.primary{background:var(--blue);color:#fff}.gold{background:var(--gold);color:#241300}.softBtn{background:var(--soft);color:var(--blue)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:50px 0}h1{font-size:clamp(2rem,5vw,4rem)}section{padding:45px 0}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,.select,.textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fbfdff}.textarea{min-height:130px}.notice,.loading{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.admin-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;margin-top:10px}.footer{background:#061126;color:#fff;padding:30px 0}@media(max-width:900px){.g2,.row{grid-template-columns:1fr}}</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="portal.html"><img src="logo.png"><h2>SpeakOut</h2></a><a class="btn softBtn" href="speakhub.html">SpeakHub</a></div></header><main><section class="hero"><div class="container"><h1>Manage SpeakHub Courses</h1><p>Create free or premium courses, modules and lessons.</p></div></section><section><div class="container grid g2"><div class="panel"><h2>Course</h2><form id="courseForm" class="form"><input id="courseId" class="input" placeholder="Course ID / slug" required><div class="row"><input id="title" class="input" placeholder="Title" required><input id="instructor" class="input" value="SpeakOut Mental Health Outreach" placeholder="Instructor"></div><div class="row"><select id="category" class="select"><option value="mental-health">Mental Health</option><option value="leadership">Leadership</option><option value="digital-skills">Digital Skills</option><option value="career">Career</option><option value="ngo">NGO Academy</option><option value="parenting">Parenting</option><option value="teacher-training">Teacher Training</option><option value="ambassador-training">Ambassador Training</option></select><select id="accessType" class="select"><option value="free">Free</option><option value="paid">Premium / Paid</option></select></div><div class="row"><input id="price" class="input" type="number" value="0"><input id="currency" class="input" value="₦"></div><div class="row"><select id="level" class="select"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select><select id="certificateEligible" class="select"><option value="true">Certificate Eligible</option><option value="false">No Certificate</option></select></div><input id="coverUrl" class="input" placeholder="Cover image URL/path"><textarea id="shortDescription" class="textarea" placeholder="Short description"></textarea><textarea id="fullDescription" class="textarea" placeholder="Full description"></textarea><textarea id="outcomes" class="textarea" placeholder="Learning outcomes, one per line"></textarea><textarea id="tags" class="textarea" placeholder="Tags, comma separated"></textarea><div class="row"><select id="status" class="select"><option value="active">Active</option><option value="draft">Draft</option><option value="archived">Archived</option></select><select id="featured" class="select"><option value="true">Featured</option><option value="false">Not Featured</option></select></div><button class="btn primary" type="submit">Save Course</button><div id="statusBox" class="notice" style="display:none"></div></form></div><div class="panel"><h2>Modules & Lessons</h2><form id="lessonForm" class="form"><input id="lessonCourseId" class="input" placeholder="Course ID this lesson belongs to" required><div class="row"><input id="moduleTitle" class="input" placeholder="Module title"><input id="moduleOrder" class="input" type="number" value="1"></div><div class="row"><input id="lessonTitle" class="input" placeholder="Lesson title" required><input id="lessonOrder" class="input" type="number" value="1"></div><textarea id="lessonContentHtml" class="textarea" placeholder="Lesson content HTML"></textarea><textarea id="activity" class="textarea" placeholder="Activity / assignment"></textarea><textarea id="quizPrompt" class="textarea" placeholder="Reflection or quiz prompt"></textarea><button class="btn gold" type="submit">Save Module + Lesson</button><div id="lessonStatusBox" class="notice" style="display:none"></div></form></div></div></section><section><div class="container"><div class="panel"><h2>Existing Courses</h2><div id="loading" class="loading">Loading courses...</div><div id="adminList"></div></div></div></section></main><footer class="footer"><div class="container">SpeakOut Portal</div></footer><script type="module" src="auth-guard.js"></script><script type="module">import{auth,db}from"./firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";import{collection,getDocs,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const courseForm=document.getElementById("courseForm"),lessonForm=document.getElementById("lessonForm"),box=document.getElementById("statusBox"),lbox=document.getElementById("lessonStatusBox"),list=document.getElementById("adminList"),loading=document.getElementById("loading");let admin=false;const show=(el,m,c="ok")=>{el.style.display="block";el.className="notice "+c;el.textContent=m},val=id=>document.getElementById(id).value.trim(),slug=s=>(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");async function isAdmin(u){if(!u)return false;const s=await getDoc(doc(db,"users",u.uid));return s.exists()&&s.data().role==="admin"}function fill(i){courseId.value=i.id||"";lessonCourseId.value=i.id||"";title.value=i.title||"";instructor.value=i.instructor||"";category.value=i.category||"mental-health";accessType.value=i.accessType||"free";price.value=i.price||0;currency.value=i.currency||"₦";level.value=i.level||"beginner";certificateEligible.value=i.certificateEligible===false?"false":"true";coverUrl.value=i.coverUrl||"";shortDescription.value=i.shortDescription||i.description||"";fullDescription.value=i.fullDescription||"";outcomes.value=Array.isArray(i.outcomes)?i.outcomes.join("\n"):"";tags.value=Array.isArray(i.tags)?i.tags.join(", "):"";status.value=i.status||"active";featured.value=i.featured===true?"true":"false";scrollTo({top:0,behavior:"smooth"})}async function loadCourses(){const snap=await getDocs(collection(db,"courses"));const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));loading.style.display="none";list.innerHTML=arr.map(c=>`<div class="admin-item"><div><strong>${c.title||c.id}</strong><br><small>${c.category||""} • ${c.accessType||"free"} • ${c.status||"active"}</small></div><button class="btn softBtn" data-id="${c.id}" type="button">Edit</button></div>`).join("")||'<div class="notice">No courses yet.</div>';list.querySelectorAll("button[data-id]").forEach(btn=>btn.onclick=async()=>{const s=await getDoc(doc(db,"courses",btn.dataset.id));if(s.exists())fill({id:s.id,...s.data()})})}onAuthStateChanged(auth,async u=>{admin=await isAdmin(u);if(!admin){show(box,"Access denied. Admin role required.","bad");courseForm.querySelectorAll("input,select,textarea,button").forEach(e=>e.disabled=true);lessonForm.querySelectorAll("input,select,textarea,button").forEach(e=>e.disabled=true);loading.textContent="Admin role required.";return}show(box,"Admin verified. You can save courses.","ok");await loadCourses()});courseForm.onsubmit=async e=>{e.preventDefault();if(!admin)return;const id=slug(val("courseId")||val("title"));const item={title:val("title"),slug:id,instructor:val("instructor")||"SpeakOut Mental Health Outreach",category:val("category"),accessType:val("accessType"),price:Number(val("price")||0),currency:val("currency")||"₦",level:val("level"),certificateEligible:val("certificateEligible")==="true",coverUrl:val("coverUrl"),shortDescription:val("shortDescription"),fullDescription:val("fullDescription"),outcomes:val("outcomes").split("\n").map(x=>x.trim()).filter(Boolean),tags:val("tags").split(",").map(x=>x.trim()).filter(Boolean),status:val("status"),featured:val("featured")==="true",updatedAt:serverTimestamp()};try{await setDoc(doc(db,"courses",id),item,{merge:true});show(box,"Course saved.","ok");lessonCourseId.value=id;await loadCourses()}catch(err){show(box,err.message||"Failed.","bad")}};lessonForm.onsubmit=async e=>{e.preventDefault();if(!admin)return;const cid=slug(val("lessonCourseId"));const mid=cid+"-module-"+Number(val("moduleOrder")||1);const lid=cid+"-lesson-"+Number(val("lessonOrder")||1);try{await setDoc(doc(db,"courseModules",mid),{courseId:cid,title:val("moduleTitle")||"Module "+val("moduleOrder"),order:Number(val("moduleOrder")||1),updatedAt:serverTimestamp()},{merge:true});await setDoc(doc(db,"courseLessons",lid),{courseId:cid,moduleId:mid,title:val("lessonTitle"),order:Number(val("lessonOrder")||1),contentHtml:val("lessonContentHtml"),activity:val("activity"),quizPrompt:val("quizPrompt"),updatedAt:serverTimestamp()},{merge:true});show(lbox,"Module and lesson saved.","ok")}catch(err){show(lbox,err.message||"Failed.","bad")}};</script></body></html>
