<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SpeakOut Access</title>
<meta http-equiv="refresh" content="0;url=../auth.html"/>
</head>
<body>
<p>Opening the SpeakOut Access Gateway…</p>
<script>
const target=new URL("../auth.html",location.href);
for(const [key,value] of new URLSearchParams(location.search)) target.searchParams.set(key,value);
target.hash=location.hash || "access";
location.replace(target.href);
</script>
</body>
</html>
