<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | SpeakOut Portal</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="https://speakoutmentalhealth.org/">
      <img src="icons/logo.png" alt="SpeakOut"> SpeakOut Portal
    </a>
    <div class="nav-links">
      <a class="btn" href="login.html">Login</a>
    </div>
  </div>
</header>

<main class="container">
  <section class="card form">
    <h1>Create Account</h1>
    <p>Your account will be reviewed before access is granted.</p>

    <div class="field">
      <label>Full Name</label>
      <input id="name" type="text">
    </div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password">
    </div>

    <div class="field">
      <label>School Name</label>
      <input id="schoolName" type="text">
    </div>

    <div class="field">
      <label>Register As</label>
      <select id="role">
        <option value="student">Student</option>
        <option value="school">School</option>
      </select>
    </div>

    <button class="btn btn-primary" id="registerBtn">Submit Registration</button>
    <p id="message" class="notice" style="display:none;margin-top:14px;"></p>
  </section>
</main>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const msg = document.getElementById("message");

document.getElementById("registerBtn").addEventListener("click", async () => {
  msg.style.display = "none";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const schoolName = document.getElementById("schoolName").value.trim();
  const role = document.getElementById("role").value;

  if (!name || !email || !password || !schoolName) {
    msg.textContent = "Please fill all fields.";
    msg.style.display = "block";
    return;
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    await setDoc(doc(db, "users", user.uid), {
      name,
      email,
      schoolName,
      role,
      status: "pending",
      createdAt: serverTimestamp()
    });

    window.location.href = "pending.html";
  } catch (error) {
    msg.textContent = error.message;
    msg.style.display = "block";
  }
});
</script>
</body>
</html>
