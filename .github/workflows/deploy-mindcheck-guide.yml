name: Deploy MindCheck Guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mindcheck-guide.yml"
  pull_request:
    paths:
      - ".github/workflows/deploy-mindcheck-guide.yml"

permissions:
  contents: read

concurrency:
  group: mindcheck-guide-production
  cancel-in-progress: false

env:
  # Deploy the reviewed MindCheck source, never a moving cross-repository ref.
  MINDCHECK_SOURCE: 479566f632a293a84f5142c204b8cbb6d1064283
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    name: Validate MindCheck guide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mindcheck/server/guide
    steps:
      - uses: actions/checkout@v4
        with:
          repository: speakoutMentalHealth/MindCheck
          ref: ${{ env.MINDCHECK_SOURCE }}
          path: mindcheck
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mindcheck/server/guide/package-lock.json
      - run: npm ci
      - name: Check private request contract and provider fallback
        run: npm test
      - name: Check production bundle without publishing
        run: npm run build

  deploy:
    name: Deploy guide pilot server
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    defaults:
      run:
        working-directory: mindcheck/server/guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: speakoutMentalHealth/MindCheck
          ref: ${{ env.MINDCHECK_SOURCE }}
          path: mindcheck
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mindcheck/server/guide/package-lock.json
      - name: Require existing Cloudflare deployment access
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment access is missing. No guide server was published."
            exit 1
          fi
      - run: npm ci
      - name: Require the saved Gemini secret without reading its value
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const secrets = JSON.parse(execFileSync('npx', ['wrangler', 'secret', 'list'], {encoding:'utf8'}));
          if (!secrets.some(item => item.name === 'GEMINI_API_KEY')) throw new Error('GEMINI_API_KEY is not configured on mindcheck-guide.');
          console.log('GEMINI_API_KEY binding exists. Its value was not read or displayed.');
          NODE
      - name: Enable the separate Nigeria/US guide pilot
        run: npx wrangler deploy --var GUIDE_ENABLED:true
      - name: Check public contract from the CI region
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = 'https://mindcheck-guide.speakout-platform-api.workers.dev/';
          const origin = 'https://mindcheck.speakoutmentalhealth.org';
          async function post(body) {
            return fetch(url, {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(15000)
            });
          }
          const selection = { question: 'learn-listening', language: 'en', adult: true };
          const fallback = await post(selection);
          assert.equal(fallback.status, 200, 'server must return a valid answer');
          assert.equal(fallback.headers.get('Access-Control-Allow-Origin'), origin);
          const data = await fallback.json();
          console.log('Provider verification:', JSON.stringify({source:data.source,reason:data.reason||null}));
          assert.equal(data.source, 'gemini', 'live provider generation must succeed in the permitted CI region');
          assert.equal(typeof data.answer, 'string');
          assert(data.answer.length >= 10 && data.answer.length <= 900);
          const invalid = await post({ ...selection, prompt: 'TEST_ONLY_PUBLIC_FIXTURE' });
          assert.equal(invalid.status, 400, 'unexpected free-text fields must be rejected');
          const method = await fetch(url, { headers: { Origin: origin }, signal: AbortSignal.timeout(15000) });
          assert.equal(method.status, 405);
          console.log('Live answer contract, CORS, fixed-field validation and method guard passed. No country metadata was overridden.');
          NODE
      - name: Explain remaining activation step
        shell: bash
        run: |
          echo "MindCheck guide server was deployed with GUIDE_ENABLED=true; the Nigeria geographic restriction remains enforced."
          echo "The existing server secret was retained without reading its value."
          echo "Actual Gemini output still requires a permitted Nigeria-origin user test; CI success alone is not proof of generation."
