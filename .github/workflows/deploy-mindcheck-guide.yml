name: Deploy MindCheck Guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mindcheck-guide.yml"
  pull_request:
    paths:
      - ".github/workflows/deploy-mindcheck-guide.yml"

permissions:
  contents: read

concurrency:
  group: mindcheck-guide-production
  cancel-in-progress: false

env:
  # Deploy the reviewed MindCheck source, never a moving cross-repository ref.
  MINDCHECK_SOURCE: ea2ba9b018c6dabdfe0a22006b79636304976074
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    name: Validate MindCheck guide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mindcheck/server/guide
    steps:
      - uses: actions/checkout@v4
        with:
          repository: speakoutMentalHealth/MindCheck
          ref: ${{ env.MINDCHECK_SOURCE }}
          path: mindcheck
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mindcheck/server/guide/package-lock.json
      - run: npm ci
      - name: Check private request contract and provider fallback
        run: npm test
      - name: Check production bundle without publishing
        run: npm run build

  deploy:
    name: Deploy disabled guide server
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    defaults:
      run:
        working-directory: mindcheck/server/guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: speakoutMentalHealth/MindCheck
          ref: ${{ env.MINDCHECK_SOURCE }}
          path: mindcheck
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mindcheck/server/guide/package-lock.json
      - name: Require existing Cloudflare deployment access
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare deployment access is missing. No guide server was published."
            exit 1
          fi
      - run: npm ci
      - name: Publish the separate disabled guide Worker
        run: npx wrangler deploy
      - name: Check live disabled server without an AI request
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = 'https://mindcheck-guide.speakout-platform-api.workers.dev/';
          const origin = 'https://mindcheck.speakoutmentalhealth.org';
          async function post(body) {
            return fetch(url, {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(15000)
            });
          }
          const selection = { question: 'mood', language: 'en', adult: true };
          const fallback = await post(selection);
          assert.equal(fallback.status, 200, 'disabled server must return a prepared answer');
          assert.equal(fallback.headers.get('Access-Control-Allow-Origin'), origin);
          const data = await fallback.json();
          assert.equal(data.source, 'prepared', 'no Gemini generation during this check');
          assert.match(data.answer, /this browser/);
          const invalid = await post({ ...selection, prompt: 'TEST_ONLY_PUBLIC_FIXTURE' });
          assert.equal(invalid.status, 400, 'unexpected free-text fields must be rejected');
          const method = await fetch(url, { headers: { Origin: origin }, signal: AbortSignal.timeout(15000) });
          assert.equal(method.status, 405);
          console.log('Live prepared fallback, CORS, fixed-field validation and method guard passed. No AI generation requested.');
          NODE
      - name: Explain remaining activation step
        shell: bash
        run: |
          echo "MindCheck guide server was deployed with GUIDE_ENABLED=false."
          echo "No Gemini API key is supplied by this workflow. No live AI request was made."
          echo "Add GEMINI_API_KEY as a Secret on the mindcheck-guide Worker, then perform controlled acceptance before enabling the public guide."
