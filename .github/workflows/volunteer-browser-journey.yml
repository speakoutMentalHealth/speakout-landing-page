name: Volunteer synthetic browser journey
on:
  pull_request:
    paths:
      - 'tests/volunteer-browser-journey.mjs'
      - 'tests/forum-people-browser.mjs'
      - 'js/forum-people-admin.js'
      - 'js/forum-account-approval.js'
      - 'admin-forum-access.html'
      - 'admin-users.html'
      - 'tests/volunteer-admin-accordion-browser.mjs'
      - 'tests/volunteer-ai-admin-browser.mjs'
      - 'volunteer-dashboard.html'
      - 'js/volunteer-onboarding.js'
      - 'js/volunteer-inbox.js'
      - 'js/admin-volunteers.js'
      - 'admin-volunteers.html'
      - 'firebase/firestore.rules'
      - 'launch-role-guard.js'
      - 'firebase-config.js'
      - '.github/workflows/volunteer-browser-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-volunteer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run synthetic volunteer browser journey
        run: node tests/volunteer-browser-journey.mjs
      - name: Run synthetic room selection and account approval
        run: node tests/forum-people-browser.mjs
      - name: Run volunteer admin accordion mobile journey
        run: node tests/volunteer-admin-accordion-browser.mjs
      - name: Gemini volunteer admin recommendation browser journey
        run: node tests/volunteer-ai-admin-browser.mjs
