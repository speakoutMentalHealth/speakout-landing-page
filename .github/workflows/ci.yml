name: SpeakOut CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/speakout-on-the-move]

permissions:
  contents: read

concurrency:
  group: speakout-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test

  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore emulator security tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-speakout-rules --only firestore "node --test tests/firestore-rules.emulator.test.mjs"
