name: Firebase Hosting Storage Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firebase-hosting-storage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Inspect Firebase Hosting storage
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/platform-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit Hosting versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { importPKCS8, SignJWT } from "jose";
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          if(!sa.client_email||!sa.private_key)throw new Error("Firebase service account unavailable.");
          const now=Math.floor(Date.now()/1000);
          const key=await importPKCS8(String(sa.private_key).replace(/\\n/g,"\n"),"RS256");
          const assertion=await new SignJWT({scope:"https://www.googleapis.com/auth/cloud-platform"})
            .setProtectedHeader({alg:"RS256",typ:"JWT"})
            .setIssuer(sa.client_email)
            .setAudience("https://oauth2.googleapis.com/token")
            .setIssuedAt(now).setExpirationTime(now+3600).sign(key);
          const tr=await fetch("https://oauth2.googleapis.com/token",{
            method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion})
          });
          if(!tr.ok)throw new Error("OAuth failed: "+tr.status);
          const {access_token}=await tr.json();
          const headers={authorization:"Bearer "+access_token};
          const site="speaakout-portal";
          const api="https://firebasehosting.googleapis.com/v1beta1";

          async function get(url){
            const r=await fetch(url,{headers});
            if(!r.ok)throw new Error(r.status+" "+await r.text());
            return r.json();
          }
          async function listAll(kind,pageSize=100){
            let token="",rows=[];
            do{
              const u=new URL(`${api}/sites/${site}/${kind}`);
              u.searchParams.set("pageSize",String(pageSize));
              if(token)u.searchParams.set("pageToken",token);
              const body=await get(u);
              rows.push(...(body[kind]||[]));
              token=body.nextPageToken||"";
            }while(token);
            return rows;
          }

          const [channels,releases,versions]=await Promise.all([
            listAll("channels",100),listAll("releases",100),listAll("versions",100)
          ]);
          const live=channels.find(x=>String(x.name||"").endsWith("/channels/live"))||null;
          const currentVersion=live?.release?.version?.name||"";
          const liveReleases=releases
            .filter(x=>!String(x.name||"").includes("/channels/")||String(x.name||"").includes("/channels/live/"))
            .sort((a,b)=>String(b.releaseTime||"").localeCompare(String(a.releaseTime||"")));
          const activeVersions=versions.filter(x=>x.status!=="DELETED");
          const totalBytes=activeVersions.reduce((sum,x)=>sum+Number(x.versionBytes||0),0);
          const summary={
            liveChannel:live?{
              name:live.name,
              retainedReleaseCount:live.retainedReleaseCount??null,
              currentVersion,
              currentRelease:live.release?.name||""
            }:null,
            counts:{
              channels:channels.length,
              releases:releases.length,
              versions:versions.length,
              activeVersions:activeVersions.length
            },
            activeVersionBytes:totalBytes,
            activeVersionGiB:Number((totalBytes/1073741824).toFixed(3)),
            newestVersions:activeVersions
              .sort((a,b)=>String(b.createTime||"").localeCompare(String(a.createTime||"")))
              .slice(0,25)
              .map(x=>({
                name:x.name,status:x.status,createTime:x.createTime,
                versionBytes:Number(x.versionBytes||0),fileCount:Number(x.fileCount||0),
                current:x.name===currentVersion
              })),
            newestLiveReleases:liveReleases.slice(0,15).map(x=>({
              name:x.name,releaseTime:x.releaseTime,
              version:x.version?.name||"",current:(x.version?.name||"")===currentVersion
            }))
          };
          console.log("HOSTING_STORAGE_AUDIT="+JSON.stringify(summary));
          NODE
