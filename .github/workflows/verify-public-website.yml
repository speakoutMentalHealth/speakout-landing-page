name: Verify Public Website Publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pages/schools.html"
      - "pages/academy.html"
      - "pages/resources.html"
      - "auth.html"
      - ".github/workflows/verify-public-website.yml"

permissions:
  contents: read

concurrency:
  group: verify-public-website
  cancel-in-progress: false

jobs:
  publication-check:
    name: Compare live entry pages with release markers
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check public site publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = "https://speakoutmentalhealth.org"
          # Each live marker must first exist in the exact checked-out release source.
          # Otherwise a stale workflow assertion could fail after a correct deployment.
          checks = {
              "/": ("index.html", 'aria-label="SpeakOut program pathways"'),
              "/pages/about.html": ("pages/about.html", "School programmes"),
              "/pages/impact.html": ("pages/impact.html", "School programmes"),
              "/pages/schools.html": ("pages/schools.html", "School programmes"),
              "/pages/donate.html": ("pages/donate.html", "School partnerships"),
              "/pages/academy.html": ("pages/academy.html", "Open Member Portal"),
              "/pages/resources.html": ("pages/resources.html", "Member Portal links open sign-in. Availability of individual handbooks is not confirmed here."),
          }
          failures = []
          for path, (source_path, marker) in checks.items():
              if marker not in Path(source_path).read_text(encoding="utf-8"):
                  raise SystemExit(f"Stale verifier marker is absent from release source: {source_path}")
              ok = False
              for attempt in range(4):
                  try:
                      # A commit-scoped URL avoids comparing an older CDN cache entry.
                      url = f"{base}{path}?release={os.environ.get('GITHUB_SHA', '')[:12]}&attempt={attempt}"
                      request = urllib.request.Request(url,
                          headers={"User-Agent": "SpeakOut-release-verifier/1.1",
                                   "Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          page = response.read().decode("utf-8", "replace")
                          old_claim = source_path in {"index.html", "pages/about.html", "pages/impact.html", "pages/schools.html", "pages/donate.html"} and '<strong data-count="21">21+</strong>' in page
                          ok = response.status == 200 and marker in page and not old_claim
                          if old_claim:
                              print(f"{path}: retired unverified impact counter still published", flush=True)
                  except (urllib.error.URLError, TimeoutError) as error:
                      print(f"{path}: request failed: {error}", flush=True)
                  if ok:
                      print(f"PASS {path}: live marker verified", flush=True)
                      break
                  if attempt < 3:
                      time.sleep(10)
              if not ok:
                  failures.append(path)
                  print(f"FAIL {path}: publication marker not verified", flush=True)
          if failures:
              raise SystemExit("Public site publication unverified for: " + ", ".join(failures))
          PY
