name: Curator Apply First Learning Drafts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/curator-apply-first-learning-drafts.yml"

permissions:
  contents: read

jobs:
  apply:
    name: Send selected learning candidates to drafts
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/platform-api/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Apply reviewed draft decisions
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL is not configured."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { importPKCS8, SignJWT } from "jose";

          const candidateIds=[
            "yt-gq0th2WoU8I",
            "yt-EjBqwFYd-9M",
            "yt-jeRCmM28bYI"
          ];
          const reviewer="github-curator-assisted-review";
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          const nowSeconds=Math.floor(Date.now()/1000);
          const key=await importPKCS8(String(sa.private_key||"").replace(/\\n/g,"\n"),"RS256");
          const assertion=await new SignJWT({scope:"https://www.googleapis.com/auth/datastore"})
            .setProtectedHeader({alg:"RS256",typ:"JWT"})
            .setIssuer(sa.client_email)
            .setAudience("https://oauth2.googleapis.com/token")
            .setIssuedAt(nowSeconds)
            .setExpirationTime(nowSeconds+3600)
            .sign(key);

          const tokenResponse=await fetch("https://oauth2.googleapis.com/token",{
            method:"POST",
            headers:{"content-type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({
              grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion
            })
          });
          if(!tokenResponse.ok)throw new Error("Google OAuth failed: "+tokenResponse.status);
          const {access_token}=await tokenResponse.json();
          const headers={
            authorization:"Bearer "+access_token,
            "content-type":"application/json"
          };
          const base="https://firestore.googleapis.com/v1/projects/speaakout-portal/databases/(default)/documents";

          const decode=value=>{
            if(!value)return null;
            if("stringValue" in value)return value.stringValue;
            if("integerValue" in value)return Number(value.integerValue);
            if("doubleValue" in value)return Number(value.doubleValue);
            if("booleanValue" in value)return Boolean(value.booleanValue);
            if("timestampValue" in value)return value.timestampValue;
            if("nullValue" in value)return null;
            if("arrayValue" in value)return (value.arrayValue.values||[]).map(decode);
            if("mapValue" in value)return Object.fromEntries(Object.entries(value.mapValue.fields||{}).map(([k,v])=>[k,decode(v)]));
            return null;
          };
          const encode=value=>{
            if(value===null||value===undefined)return {nullValue:null};
            if(typeof value==="boolean")return {booleanValue:value};
            if(typeof value==="number")return Number.isInteger(value)?{integerValue:String(value)}:{doubleValue:value};
            if(typeof value==="string")return {stringValue:value};
            if(Array.isArray(value))return {arrayValue:{values:value.map(encode)}};
            return {mapValue:{fields:Object.fromEntries(Object.entries(value).map(([k,v])=>[k,encode(v)]))}};
          };
          const decodeDoc=doc=>Object.fromEntries(Object.entries(doc.fields||{}).map(([k,v])=>[k,decode(v)]));
          const encodeFields=record=>Object.fromEntries(Object.entries(record).map(([k,v])=>[k,encode(v)]));

          async function getDoc(path){
            const response=await fetch(base+"/"+path,{headers});
            if(response.status===404)return null;
            if(!response.ok)throw new Error(path+" read failed: "+response.status+" "+await response.text());
            return response.json();
          }
          async function putDoc(path,record){
            const response=await fetch(base+"/"+path,{
              method:"PATCH",headers,
              body:JSON.stringify({fields:encodeFields(record)})
            });
            if(!response.ok)throw new Error(path+" write failed: "+response.status+" "+await response.text());
            return response.json();
          }

          const results=[];
          for(const candidateId of candidateIds){
            const rawCandidate=await getDoc("tvCuratorCandidates/"+candidateId);
            if(!rawCandidate)throw new Error("Candidate not found: "+candidateId);
            const candidate=decodeDoc(rawCandidate);
            if(!["pending","drafted"].includes(String(candidate.status||""))) {
              throw new Error("Candidate is not reviewable: "+candidateId+" status="+candidate.status);
            }
            if(!["course","audiobook"].includes(String(candidate.learningType||""))) {
              throw new Error("Candidate is not learning content: "+candidateId);
            }
            const videoId=String(candidate.videoId||candidateId.replace(/^yt-/,""));
            const episodeId="curated-"+videoId;
            const existingRaw=await getDoc("tvEpisodes/"+episodeId);
            const existing=existingRaw?decodeDoc(existingRaw):{};
            const now=new Date().toISOString();
            const tags=[
              candidate.learningType,
              candidate.regionFocus,
              "education",
              ...(Array.isArray(candidate.tags)?candidate.tags.slice(0,6):[])
            ].filter(Boolean);
            const episode={
              ...existing,
              title:String(candidate.title||"Curated YouTube learning"),
              show:String(candidate.show||(candidate.learningType==="audiobook"?"Listen & Learn Africa":"Learn Nigeria & Africa")),
              description:String(candidate.description||"").slice(0,2000),
              presenter:"",
              guest:"",
              guestRole:"",
              tags:[...new Set(tags.map(String))].join(", "),
              url:String(candidate.url||""),
              tiktokUrl:"",
              imageUrl:String(candidate.thumbnailUrl||""),
              format:"episode",
              status:"draft",
              homePlacement:"library_only",
              programmingDays:"all",
              placementPriority:100,
              placementStart:"",
              placementEnd:"",
              contentPillar:String(candidate.contentPillar||"general"),
              audience:String(candidate.audience||"students"),
              learningType:String(candidate.learningType),
              regionFocus:String(candidate.regionFocus||"africa"),
              featured:"false",
              publishDate:String(candidate.publishedAt||"").slice(0,10),
              order:0,
              scheduledAt:"",
              sponsor:"",
              consentConfirmed:"no",
              minorInvolved:"no",
              editorialReview:"pending",
              sourceType:"youtube-curated",
              sourceChannelTitle:String(candidate.channelTitle||""),
              sourceChannelId:String(candidate.channelId||""),
              sourceVideoId:videoId,
              sourceUrl:String(candidate.url||""),
              sourceAttribution:"YouTube · "+String(candidate.channelTitle||"Original creator"),
              sourceTitle:String(candidate.title||""),
              sourceDescription:String(candidate.description||""),
              sourceThumbnailUrl:String(candidate.thumbnailUrl||""),
              youtubeMetadataRefreshedAt:now,
              curatorManagedMetadata:true,
              curatedBySpeakOut:true,
              createdAt:String(existing.createdAt||now),
              updatedAt:now,
              updatedBy:reviewer
            };
            await putDoc("tvEpisodes/"+episodeId,episode);

            const updatedCandidate={
              ...candidate,
              status:"drafted",
              draftEpisodeId:episodeId,
              reviewedAt:now,
              reviewedBy:reviewer,
              updatedAt:now,
              updatedBy:reviewer
            };
            await putDoc("tvCuratorCandidates/"+candidateId,updatedCandidate);
            results.push({candidateId,episodeId,title:episode.title,learningType:episode.learningType});
          }
          console.log("CURATOR_DRAFT_RESULT="+JSON.stringify(results));
          NODE
