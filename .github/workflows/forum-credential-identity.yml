name: Forum Credential Identity (Read Only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  identify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Show only validated service account identity
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          try:
              credentials = json.loads(os.environ.get('SERVICE_ACCOUNT_JSON', ''))
          except (ValueError, TypeError):
              raise SystemExit('Credential JSON is missing or invalid. No credential contents printed.') from None
          if not isinstance(credentials, dict):
              raise SystemExit('Expected a service account credential object.')
          project = credentials.get('project_id')
          email = credentials.get('client_email')
          if credentials.get('type') != 'service_account' or project != 'speaakout-portal':
              raise SystemExit('Expected a service account belonging to speaakout-portal.')
          if not isinstance(email, str) or not re.fullmatch(r'[a-z0-9-]+@speaakout-portal\.iam\.gserviceaccount\.com', email):
              raise SystemExit('Unexpected service account email format. No credential contents printed.')
          print('Production workflow service account: ' + email)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Production workflow identity\n\n')
              summary.write('Service account: ' + email + '\n\n')
              summary.write('Project: ' + project + '\n\n')
              summary.write('Only identity fields were displayed. No tokens generated, Google APIs called, or permissions and database data changed.\n')
          PY
