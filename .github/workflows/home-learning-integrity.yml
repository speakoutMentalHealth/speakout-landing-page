name: Home Learning integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/home-learning-catalog.json'
      - 'scripts/home-learning-resource-digests.mjs'
      - 'scripts/home-learning-verify-pinned-source.mjs'
      - 'scripts/home-learning-staging-preflight.mjs'
      - 'tests/phase129-staging-preflight.test.mjs'
      - '*home-learning-packs.html'
      - 'early-years-counting-pack.html'
      - 'functions/index.js'
      - 'firebase/firestore.rules'
      - 'functions/home-learning-manifest-candidate-store.js'
      - 'functions/home-learning-manifest-ingestion.js'
      - 'functions/home-learning-pinned-source.js'
      - 'functions/home-learning-manifest-callable.js'
      - 'functions/home-learning-staging-gate.js'
      - 'tests/phase128-staging-project-gate.test.mjs'
      - 'tests/phase127-manifest-callable-auth.test.mjs'
      - 'tests/phase125-pinned-source.test.mjs'
      - 'tests/phase126-manifest-duplicate-ingestion.test.mjs'
      - 'tests/firestore-rules.emulator.test.mjs'
      - 'tests/phase124-manifest-ingestion.test.mjs'
      - 'tests/phase123-manifest-candidate-rules.test.mjs'
      - 'functions/home-learning-manifest-validator.js'
      - 'tests/phase122-manifest-candidate-validator.test.mjs'
      - 'tests/phase120-manifest-assignment-binding.test.mjs'
      - 'tests/phase121-resource-digest-hardening.test.mjs'
      - '.github/workflows/home-learning-integrity.yml'
  pull_request:
    paths:
      - 'data/home-learning-catalog.json'
      - 'scripts/home-learning-resource-digests.mjs'
      - '*home-learning-packs.html'
      - 'early-years-counting-pack.html'
      - 'functions/index.js'
      - 'firebase/firestore.rules'
      - 'functions/home-learning-manifest-candidate-store.js'
      - 'functions/home-learning-manifest-ingestion.js'
      - 'functions/home-learning-pinned-source.js'
      - 'functions/home-learning-manifest-callable.js'
      - 'functions/home-learning-staging-gate.js'
      - 'tests/phase128-staging-project-gate.test.mjs'
      - 'tests/phase127-manifest-callable-auth.test.mjs'
      - 'tests/phase125-pinned-source.test.mjs'
      - 'tests/phase126-manifest-duplicate-ingestion.test.mjs'
      - 'tests/firestore-rules.emulator.test.mjs'
      - 'tests/phase124-manifest-ingestion.test.mjs'
      - 'tests/phase123-manifest-candidate-rules.test.mjs'
      - 'functions/home-learning-manifest-validator.js'
      - 'tests/phase122-manifest-candidate-validator.test.mjs'
      - 'tests/phase120-manifest-assignment-binding.test.mjs'
      - 'tests/phase121-resource-digest-hardening.test.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check backend JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/home-learning-manifest-callable.js
          node --check functions/home-learning-staging-gate.js
          node --check functions/home-learning-manifest-ingestion.js
          node --check functions/home-learning-manifest-candidate-store.js
          node --check functions/home-learning-manifest-validator.js
          node --check functions/home-learning-pinned-source.js
      - run: node scripts/home-learning-resource-digests.mjs --output candidate-digests.json
      - run: node --test tests/phase11*.test.mjs tests/phase120-manifest-assignment-binding.test.mjs tests/phase121-resource-digest-hardening.test.mjs tests/phase122-manifest-candidate-validator.test.mjs tests/phase123-manifest-candidate-rules.test.mjs tests/phase124-manifest-ingestion.test.mjs tests/phase125-pinned-source.test.mjs tests/phase126-manifest-duplicate-ingestion.test.mjs tests/phase127-manifest-callable-auth.test.mjs tests/phase128-staging-project-gate.test.mjs tests/phase129-staging-preflight.test.mjs
      - name: Verify real GitHub source bytes at pinned main commit
        if: github.event_name != 'pull_request'
        run: node scripts/home-learning-verify-pinned-source.mjs
      - name: Validate candidate digest report
        run: node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('candidate-digests.json','utf8')); if(d.status!=='candidate-unverified'||d.resources.length!==16||d.resources.some(x=>x.reviewStatus!=='unreviewed'||! /^[a-f0-9]{64}$/.test(x.contentSha256))) process.exit(1);"
      - uses: actions/upload-artifact@v4
        with:
          name: home-learning-candidate-digests
          path: candidate-digests.json
