name: Education Sections Browser
on:
  pull_request:
    branches: [main]
    paths: ["content/kiddies/nursery-unit-04.md", "content/kiddies/primary1-unit-04.md", "content/kiddies/nursery-unit-03.md", "content/kiddies/primary1-unit-03.md", "content/kiddies/nursery-unit-02.md", "content/kiddies/primary1-unit-02.md", "kiddies.html", "css/pages/kiddies-adventure-hub.css", "js/kiddies-adventures.js", "kiddies-unit.html", "js/kiddies-catalogue.js", "js/learner/kiddies-unit.js", "css/pages/kiddies-unit.css", "firestore-seed/build-kiddies-catalogue.mjs", "kiddies-units-review.html", "js/kiddies-units-review.js", "css/pages/kiddies-units.css", "firestore-seed/build-kiddies-units.mjs", "content/kiddies/nursery-unit-01.md", "content/kiddies/primary1-unit-01.md", "national-curriculum.html", "js/national-curriculum.js", "js/national-curriculum-guide.js", "css/pages/national-curriculum.css", "js/content-tracks.js", "js/curriculum-mapping.js", "firestore-seed/build-kiddies-starter.mjs", "kiddies-review.html", "admin-kiddies-review.html", "js/kiddies-review.js", "js/kiddies-starter-pack.js", "js/admin/kiddies-drafts.js", "css/pages/kiddies-review.css", "firestore-seed/kiddies-starter-pack.json", "tests/kiddies-starter-browser.mjs", "my-learning.html", "js/education-levels.js", "js/learner/my-learning.js", "css/pages/my-learning.css", "tests/education-sections-browser.mjs", ".github/workflows/education-sections-browser.yml"]
  push:
    branches: [main]
    paths: ["content/kiddies/nursery-unit-04.md", "content/kiddies/primary1-unit-04.md", "content/kiddies/nursery-unit-03.md", "content/kiddies/primary1-unit-03.md", "content/kiddies/nursery-unit-02.md", "content/kiddies/primary1-unit-02.md", "kiddies.html", "css/pages/kiddies-adventure-hub.css", "js/kiddies-adventures.js", "kiddies-unit.html", "js/kiddies-catalogue.js", "js/learner/kiddies-unit.js", "css/pages/kiddies-unit.css", "firestore-seed/build-kiddies-catalogue.mjs", "kiddies-units-review.html", "js/kiddies-units-review.js", "css/pages/kiddies-units.css", "firestore-seed/build-kiddies-units.mjs", "content/kiddies/nursery-unit-01.md", "content/kiddies/primary1-unit-01.md", "national-curriculum.html", "js/national-curriculum.js", "js/national-curriculum-guide.js", "css/pages/national-curriculum.css", "js/content-tracks.js", "js/curriculum-mapping.js", "firestore-seed/build-kiddies-starter.mjs", "kiddies-review.html", "admin-kiddies-review.html", "js/kiddies-review.js", "js/kiddies-starter-pack.js", "js/admin/kiddies-drafts.js", "css/pages/kiddies-review.css", "firestore-seed/kiddies-starter-pack.json", "tests/kiddies-starter-browser.mjs", "my-learning.html", "js/education-levels.js", "js/learner/my-learning.js", "css/pages/my-learning.css", "tests/education-sections-browser.mjs", ".github/workflows/education-sections-browser.yml"]
permissions:
  contents: read
jobs:
  learning-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - name: Start portal
        run: |
          python3 -m http.server 4173 > /tmp/education-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/my-learning.html > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check education sections and accessible class filtering
        run: |
          node tests/education-sections-browser.mjs
          node tests/kiddies-starter-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: education-sections-evidence
          path: artifacts/education-sections
          retention-days: 30
