name: Clear stuck GitHub Pages deployment (one-time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kiddies-tv-pages-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect and cancel only the known stuck Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STUCK_PAGES_SHA: 5c2a3bd4e329f5ca19e1359986abff13e7bac12b
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STUCK_PAGES_SHA}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10")
          response="$(curl --fail --silent --show-error "${auth[@]}" "${api}")"
          status="$(printf '%s' "${response}" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("status","unknown"))')"
          echo "Pages deployment ${STUCK_PAGES_SHA} status: ${status}"
          # GitHub Pages reports "succeed" for this SHA, but three subsequent
          # deployment attempts were rejected because this exact SHA still owns
          # the backend in-progress lock. Explicitly cancel ONLY this SHA.
          if [[ "${status}" == "cancelled" ]]; then
            echo "Stale deployment was already cancelled."
            exit 0
          fi
          if [[ "${status}" != "succeed" && "${status}" != "success" && "${status}" != "in_progress" && "${status}" != "pending" && "${status}" != "queued" ]]; then
            echo "::error::Unexpected Pages deployment status ${status}; no cancellation performed."
            exit 1
          fi
          result="$(curl --silent --show-error -o /tmp/pages-cancel-response -w '%{http_code}' -X POST "${auth[@]}" "${api}/cancel")"
          if [[ "${result}" != "204" ]]; then
            echo "::error::Pages cancel returned HTTP ${result} (expected 204)."
            cat /tmp/pages-cancel-response
            exit 1
          fi
          echo "Cancelled the stale Pages backend lock for ${STUCK_PAGES_SHA} (HTTP 204)."
