name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firebase/firestore.rules"
      - ".github/workflows/deploy-firestore-rules.yml"

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production Firestore Rules
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Create and release Firestore ruleset
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: speaakout-portal
        run: |
          set -euo pipefail

          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "::error::Google access token was not created."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("firebase/firestore.rules").read_text(encoding="utf-8")
          payload = {
              "source": {
                  "files": [
                      {
                          "name": "firestore.rules",
                          "content": source
                      }
                  ]
              }
          }
          Path("/tmp/firestore-ruleset.json").write_text(
              json.dumps(payload),
              encoding="utf-8"
          )
          PY

          RULESET_RESPONSE="$(
            curl --fail-with-body --silent --show-error               --request POST               --header "Authorization: Bearer $ACCESS_TOKEN"               --header "Content-Type: application/json"               --data-binary @/tmp/firestore-ruleset.json               "https://firebaserules.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/rulesets"
          )"

          RULESET_NAME="$(
            printf '%s' "$RULESET_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])'
          )"

          if [[ -z "$RULESET_NAME" ]]; then
            echo "::error::Firebase Rules API did not return a ruleset name."
            exit 1
          fi

          python3 - "$FIREBASE_PROJECT_ID" "$RULESET_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          project_id = sys.argv[1]
          ruleset_name = sys.argv[2]
          payload = {
              "name": f"projects/{project_id}/releases/cloud.firestore",
              "rulesetName": ruleset_name
          }
          Path("/tmp/firestore-release.json").write_text(
              json.dumps(payload),
              encoding="utf-8"
          )
          PY

          curl --fail-with-body --silent --show-error             --request PATCH             --header "Authorization: Bearer $ACCESS_TOKEN"             --header "Content-Type: application/json"             --data-binary @/tmp/firestore-release.json             "https://firebaserules.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/releases/cloud.firestore?updateMask=rulesetName"             > /tmp/firestore-release-response.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(
              Path("/tmp/firestore-release-response.json").read_text(encoding="utf-8")
          )
          print("Firestore rules release:", response.get("name", "cloud.firestore"))
          print("Ruleset:", response.get("rulesetName", "unknown"))
          PY
