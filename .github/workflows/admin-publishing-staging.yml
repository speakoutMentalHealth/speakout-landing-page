name: Admin Publishing Staging UAT

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "admin-tv.html"
      - "js/admin-cms-ui.js"
      - "js/platform-api.js"
      - "workers/platform-api/**"
      - "tests/staging-cleanup.mjs"
      - "tests/admin-publishing-staging.mjs"
      - ".github/workflows/admin-publishing-staging.yml"

permissions:
  contents: read

concurrency:
  group: speakout-shared-staging
  cancel-in-progress: false

jobs:
  publishing-uat:
    name: TV publishing and audiobook rights UAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check staging credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required staging secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" != "0" ]]; then
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare temporary staging credentials
        shell: bash
        run: |
          printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-staging.json"
          chmod 600 "$RUNNER_TEMP/firebase-staging.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-staging.json" >> "$GITHUB_ENV"
          echo "FIREBASE_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/firebase-staging.json" >> "$GITHUB_ENV"

      - name: Install repository dependencies
        run: npm ci

      - name: Install Worker dependencies
        working-directory: workers/platform-api
        run: npm ci

      - name: Deploy branch Worker to staging
        working-directory: workers/platform-api
        run: npx wrangler deploy --config wrangler.staging.jsonc

      - name: Run admin publishing staging UAT
        run: node tests/admin-publishing-staging.mjs

      - name: Record acceptance result
        if: success()
        run: |
          echo "### Admin publishing staging UAT: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated draft-first TV publishing, public visibility, hide/unpublish behavior, deletion and audiobook rights enforcement." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publishing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-publishing-staging-evidence
          path: artifacts/admin-publishing-staging
          if-no-files-found: warn
          retention-days: 30
