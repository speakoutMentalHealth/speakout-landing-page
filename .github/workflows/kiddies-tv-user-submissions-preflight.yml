name: Kiddies TV User Submissions Preflight
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/kiddies-tv-user-submitted-african-videos-20261101.json"
      - "docs/kiddies-tv-geography-coding-age-curation-20261101.json"
      - "scripts/kiddies-tv-user-submissions-preflight.mjs"
      - ".github/workflows/kiddies-tv-user-submissions-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Metadata discovery only (no approvals)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install playlist discovery tool
        run: python -m pip install --quiet yt-dlp
      - name: Read YouTube metadata (not full video content)
        run: node scripts/kiddies-tv-user-submissions-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiddies-tv-submissions-preflight
          path: artifacts/kiddies-tv-user-submissions/preflight.json
          retention-days: 14
