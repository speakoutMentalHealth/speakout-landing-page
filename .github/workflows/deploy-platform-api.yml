name: Deploy Platform API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/platform-api/**"
      - ".github/workflows/deploy-platform-api.yml"
  pull_request:
    paths:
      - "workers/platform-api/**"
      - ".github/workflows/deploy-platform-api.yml"

permissions:
  contents: read

concurrency:
  group: platform-api-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/platform-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production dry run
        run: npm run check:production

  deploy:
    name: Deploy Production Worker
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/platform-api/package-lock.json
      - name: Check deployment credentials
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment or repository Actions secrets."
          fi
      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: npm ci
      - name: Deploy production Worker
        if: steps.preflight.outputs.ready == 'true'
        run: npm run deploy:production
      - name: Deployment status
        run: |
          if [[ "${{ steps.preflight.outputs.ready }}" == "true" ]]; then
            echo "Production Worker deployment completed."
          else
            echo "Production Worker deployment was not attempted because deployment credentials are not configured."
          fi
