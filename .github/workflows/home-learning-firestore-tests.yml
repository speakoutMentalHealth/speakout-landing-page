name: Home Learning Firebase Rules Tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/home-learning-pathways
    paths:
      - 'firebase/firestore.rules'
      - 'tests/firestore-rules.emulator.test.mjs'
      - 'js/home-learning/reviewer.js'
      - 'scripts/home-learning-approval-evidence.mjs'
      - 'scripts/home-learning-approval-proposal.mjs'
      - 'scripts/home-learning-approval-commit-guard.mjs'
      - 'scripts/home-learning-approval-rehearsal.mjs'
      - 'tests/home-learning-approval-evidence.test.mjs'
      - 'tests/home-learning-approval-proposal.test.mjs'
      - 'tests/home-learning-approval-commit-guard.test.mjs'
      - 'tests/home-learning-approval-rehearsal.test.mjs'
      - 'scripts/home-learning-review-snapshot.mjs'
      - 'tests/home-learning-review-snapshot.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/home-learning-firestore-tests.yml'
  pull_request:
    paths:
      - 'firebase/firestore.rules'
      - 'tests/firestore-rules.emulator.test.mjs'
      - 'js/home-learning/reviewer.js'
      - 'scripts/home-learning-approval-evidence.mjs'
      - 'scripts/home-learning-approval-proposal.mjs'
      - 'scripts/home-learning-approval-commit-guard.mjs'
      - 'scripts/home-learning-approval-rehearsal.mjs'
      - 'tests/home-learning-approval-evidence.test.mjs'
      - 'tests/home-learning-approval-proposal.test.mjs'
      - 'tests/home-learning-approval-commit-guard.test.mjs'
      - 'tests/home-learning-approval-rehearsal.test.mjs'
      - 'scripts/home-learning-review-snapshot.mjs'
      - 'tests/home-learning-review-snapshot.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/home-learning-firestore-tests.yml'
permissions:
  contents: read
jobs:
  firestore-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Install Firebase Admin SDK for backend emulator tests
        run: npm install --prefix functions --no-package-lock --no-audit --no-fund
      - name: Install Firebase CLI for Firestore emulator
        run: npm install --no-save --no-package-lock firebase-tools@14
      - name: Check emulator test syntax
        run: |
          node --check tests/firestore-rules.emulator.test.mjs
          node --check tests/home-learning-backend.emulator.test.mjs
      - name: Run Firestore security tests
        run: |
          mkdir -p artifacts/home-learning-firestore
          set -o pipefail
          npm run test:rules 2>&1 | tee artifacts/home-learning-firestore/emulator-tests.log
      - name: Upload Firestore security test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-learning-firestore-test-evidence
          path: artifacts/home-learning-firestore/
          retention-days: 7
          if-no-files-found: warn
