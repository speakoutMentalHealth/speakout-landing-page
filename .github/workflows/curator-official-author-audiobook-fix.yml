name: Curator Official Author Audiobook Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/curator-official-author-audiobook-fix.yml"

permissions:
  contents: read

jobs:
  apply:
    name: Correct verified official-author audiobook
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/platform-api/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Correct Giovanni Rigters audiobook classification
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { importPKCS8, SignJWT } from "jose";

          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          if(!sa.client_email||!sa.private_key)throw new Error("Firebase service account unavailable.");
          const nowSec=Math.floor(Date.now()/1000);
          const key=await importPKCS8(String(sa.private_key).replace(/\\n/g,"\n"),"RS256");
          const assertion=await new SignJWT({scope:"https://www.googleapis.com/auth/datastore"})
            .setProtectedHeader({alg:"RS256",typ:"JWT"})
            .setIssuer(sa.client_email)
            .setAudience("https://oauth2.googleapis.com/token")
            .setIssuedAt(nowSec).setExpirationTime(nowSec+3600).sign(key);
          const tokenResponse=await fetch("https://oauth2.googleapis.com/token",{
            method:"POST",
            headers:{"content-type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion})
          });
          if(!tokenResponse.ok)throw new Error("Google OAuth failed: "+tokenResponse.status);
          const {access_token}=await tokenResponse.json();

          const base="https://firestore.googleapis.com/v1/projects/speaakout-portal/databases/(default)/documents";
          const headers={authorization:"Bearer "+access_token,"content-type":"application/json"};
          const fromValue=value=>{
            if(!value)return null;
            if("stringValue" in value)return value.stringValue;
            if("integerValue" in value)return Number(value.integerValue);
            if("doubleValue" in value)return Number(value.doubleValue);
            if("booleanValue" in value)return Boolean(value.booleanValue);
            if("timestampValue" in value)return value.timestampValue;
            if("nullValue" in value)return null;
            if("arrayValue" in value)return (value.arrayValue.values||[]).map(fromValue);
            if("mapValue" in value)return decodeFields(value.mapValue.fields||{});
            return null;
          };
          const decodeFields=fields=>Object.fromEntries(Object.entries(fields||{}).map(([k,v])=>[k,fromValue(v)]));
          const toValue=value=>{
            if(value===null||value===undefined)return {nullValue:null};
            if(typeof value==="boolean")return {booleanValue:value};
            if(typeof value==="number")return Number.isInteger(value)?{integerValue:String(value)}:{doubleValue:value};
            if(typeof value==="string")return {stringValue:value};
            if(Array.isArray(value))return {arrayValue:{values:value.map(toValue)}};
            return {mapValue:{fields:Object.fromEntries(Object.entries(value).map(([k,v])=>[k,toValue(v)]))}};
          };
          async function read(path){
            const response=await fetch(base+"/"+path,{headers});
            if(!response.ok)throw new Error(path+" read failed: "+response.status);
            const doc=await response.json();
            return decodeFields(doc.fields||{});
          }
          async function patch(path,data){
            const params=new URLSearchParams();
            for(const field of Object.keys(data))params.append("updateMask.fieldPaths",field);
            const fields=Object.fromEntries(Object.entries(data).map(([k,v])=>[k,toValue(v)]));
            const response=await fetch(base+"/"+path+"?"+params.toString(),{
              method:"PATCH",headers,body:JSON.stringify({fields})
            });
            if(!response.ok)throw new Error(path+" update failed: "+response.status+" "+await response.text());
            return decodeFields((await response.json()).fields||{});
          }

          const now=new Date().toISOString();
          const episodePath="tvEpisodes/curated-QpM1DDK8P34";
          const candidatePath="tvCuratorCandidates/yt-QpM1DDK8P34";
          const episode=await read(episodePath);
          if(String(episode.sourceVideoId||"")!=="QpM1DDK8P34")throw new Error("Episode source mismatch.");
          const episodeNext=await patch(episodePath,{
            learningType:"audiobook",
            learningCategory:"business_entrepreneurship",
            regionFocus:"global",
            bookRights:"official_author",
            show:"Books & Audiobooks",
            rightsReviewState:"verified",
            rightsReviewNote:"Official-author upload verified 2026-10-03: YouTube channel is Giovanni Rigters (Invest in Yourself); commercial audiobook metadata lists Giovanni Rigters as author and publisher.",
            rightsEvidenceUrl:"https://play.google.com/store/audiobooks/details/Starting_A_Business_For_Beginners_Dummies?id=AQAAAEDc4mWiqM",
            rightsReviewedAt:now,
            updatedAt:now,
            updatedBy:"github-curator-rights-review"
          });

          let candidateResult={action:"not-found"};
          const candidateResponse=await fetch(base+"/"+candidatePath,{headers});
          if(candidateResponse.ok){
            const candidateNext=await patch(candidatePath,{
              learningType:"audiobook",
              learningCategory:"business_entrepreneurship",
              regionFocus:"global",
              bookRights:"official_author",
              show:"Books & Audiobooks",
              rightsReviewState:"verified",
              rightsReviewedAt:now,
              updatedAt:now
            });
            candidateResult={action:"updated",learningType:candidateNext.learningType,bookRights:candidateNext.bookRights};
          }

          console.log("OFFICIAL_AUTHOR_AUDIOBOOK_FIX="+JSON.stringify({
            episode:{
              id:"curated-QpM1DDK8P34",
              status:episodeNext.status,
              learningType:episodeNext.learningType,
              learningCategory:episodeNext.learningCategory,
              bookRights:episodeNext.bookRights,
              show:episodeNext.show,
              editorialReview:episodeNext.editorialReview
            },
            candidate:candidateResult
          }));
          NODE
