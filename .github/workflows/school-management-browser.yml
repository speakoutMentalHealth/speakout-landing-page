name: School Management Browser UAT

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "auth.html"
      - "js/auth.js"
      - "programmes.html"
      - "programme-workspace.html"
      - "parent-child-link.html"
      - "child-progress.html"
      - "school-dashboard.html"
      - "teacher-dashboard.html"
      - "parent-dashboard.html"
      - "launch-role-guard.js"
      - "js/programmes/**"
      - "js/learner/parent-dashboard.js"
      - "js/platform-api.js"
      - "firebase/firestore.rules"
      - "workers/platform-api/**"
      - "tests/staging-cleanup.mjs"
      - "tests/school-management-browser.mjs"
      - ".github/workflows/school-management-browser.yml"

permissions:
  contents: read

concurrency:
  group: speakout-shared-staging
  cancel-in-progress: false

jobs:
  school-management:
    name: Multi-role school management UAT
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check staging credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required staging secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" != "0" ]]; then
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare temporary staging credentials
        shell: bash
        run: |
          printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-staging.json"
          chmod 600 "$RUNNER_TEMP/firebase-staging.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-staging.json" >> "$GITHUB_ENV"
          echo "FIREBASE_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/firebase-staging.json" >> "$GITHUB_ENV"

      - name: Install repository dependencies
        run: npm ci

      - name: Deploy branch Firestore rules to staging
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project speakout-portal-staging --non-interactive

      - name: Install Worker dependencies
        working-directory: workers/platform-api
        run: npm ci

      - name: Deploy branch Worker to staging
        working-directory: workers/platform-api
        run: npx wrangler deploy --config wrangler.staging.jsonc

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local portal
        shell: bash
        run: |
          python3 -m http.server 5000 --bind 127.0.0.1 > "$RUNNER_TEMP/school-management-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/school-management-http.pid"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/auth.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/school-management-http.log"
          exit 1

      - name: Run school management browser UAT
        run: node tests/school-management-browser.mjs

      - name: Record acceptance result
        if: success()
        run: |
          echo "### School Management Browser UAT: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated school-admin approvals, teacher-created programmes, facilitator delivery, student membership, parent-child access, school isolation and explicit super-admin support mode." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-management-browser-evidence
          path: artifacts/school-management-browser
          if-no-files-found: warn
          retention-days: 14
