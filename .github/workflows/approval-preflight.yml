name: Approval Data Preflight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only audit or fail-closed legacy-flag normalization"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - normalize
      confirmation:
        description: "For normalize only, enter NORMALIZE_APPROVAL_FLAGS"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: approval-data-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Production approval-state preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --omit=dev

      - name: Audit or normalize approval flags
        env:
          APPROVAL_PREFLIGHT_MODE: ${{ inputs.mode }}
          APPROVAL_PREFLIGHT_CONFIRM: ${{ inputs.confirmation }}
        run: node functions/scripts/approval-preflight.js
