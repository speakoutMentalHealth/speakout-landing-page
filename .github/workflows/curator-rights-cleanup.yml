name: Curator Rights Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/curator-rights-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup:
    name: Return unverified audiobooks to draft
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/platform-api/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Return unverified audiobooks to draft
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { importPKCS8, SignJWT } from "jose";

          const targets=[
            "curated-4gDl4IbTpX8",
            "curated-9jAz-XbwAKM",
            "curated-NORnyHjmJ3I",
            "curated-TYtv3s8x8gg",
            "curated-h4NFyBkXyCw",
            "curated-v3lcKf4XRiI"
          ];

          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          if(!sa.client_email||!sa.private_key)throw new Error("Firebase service account unavailable.");
          const now=Math.floor(Date.now()/1000);
          const key=await importPKCS8(String(sa.private_key).replace(/\\n/g,"\n"),"RS256");
          const assertion=await new SignJWT({scope:"https://www.googleapis.com/auth/datastore"})
            .setProtectedHeader({alg:"RS256",typ:"JWT"})
            .setIssuer(sa.client_email)
            .setAudience("https://oauth2.googleapis.com/token")
            .setIssuedAt(now)
            .setExpirationTime(now+3600)
            .sign(key);

          const tokenResponse=await fetch("https://oauth2.googleapis.com/token",{
            method:"POST",
            headers:{"content-type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({
              grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion
            })
          });
          if(!tokenResponse.ok)throw new Error("Google OAuth failed: "+tokenResponse.status);
          const {access_token}=await tokenResponse.json();
          const base="https://firestore.googleapis.com/v1/projects/speaakout-portal/databases/(default)/documents";
          const headers={authorization:"Bearer "+access_token,"content-type":"application/json"};

          const fromValue=value=>{
            if(!value)return null;
            if("stringValue" in value)return value.stringValue;
            if("integerValue" in value)return Number(value.integerValue);
            if("doubleValue" in value)return Number(value.doubleValue);
            if("booleanValue" in value)return Boolean(value.booleanValue);
            if("timestampValue" in value)return value.timestampValue;
            if("nullValue" in value)return null;
            if("arrayValue" in value)return (value.arrayValue.values||[]).map(fromValue);
            if("mapValue" in value)return decodeFields(value.mapValue.fields||{});
            return null;
          };
          const decodeFields=fields=>Object.fromEntries(Object.entries(fields||{}).map(([k,v])=>[k,fromValue(v)]));
          const toValue=value=>{
            if(value===null||value===undefined)return {nullValue:null};
            if(typeof value==="boolean")return {booleanValue:value};
            if(typeof value==="number")return Number.isInteger(value)?{integerValue:String(value)}:{doubleValue:value};
            if(typeof value==="string")return {stringValue:value};
            if(Array.isArray(value))return {arrayValue:{values:value.map(toValue)}};
            return {mapValue:{fields:Object.fromEntries(Object.entries(value).map(([k,v])=>[k,toValue(v)]))}};
          };
          const encodeFields=data=>Object.fromEntries(Object.entries(data).map(([k,v])=>[k,toValue(v)]));

          const results=[];
          for(const id of targets){
            const url=base+"/tvEpisodes/"+id;
            const currentResponse=await fetch(url,{headers});
            if(!currentResponse.ok)throw new Error(id+" read failed: "+currentResponse.status);
            const currentDoc=await currentResponse.json();
            const current=decodeFields(currentDoc.fields||{});
            if(String(current.learningType||"").toLowerCase()!=="audiobook"){
              results.push({id,action:"skipped-not-audiobook"});
              continue;
            }
            const next={
              ...current,
              status:"draft",
              bookRights:"review_required",
              editorialReview:"pending",
              homePlacement:"library_only",
              rightsReviewState:"required",
              rightsReviewNote:"Returned to draft during 2026-10-03 production rights audit; verify official/authorized/public-domain evidence before publishing.",
              rightsReviewedAt:"",
              updatedAt:new Date().toISOString(),
              updatedBy:"github-curator-rights-audit"
            };
            const updateMask=Object.keys(next).map(encodeURIComponent).join("&updateMask.fieldPaths=");
            const write=await fetch(url+"?updateMask.fieldPaths="+updateMask,{
              method:"PATCH",
              headers,
              body:JSON.stringify({fields:encodeFields(next)})
            });
            if(!write.ok)throw new Error(id+" update failed: "+write.status+" "+await write.text());
            results.push({id,action:"drafted",previousStatus:current.status||"",previousRights:current.bookRights||""});
          }
          console.log("RIGHTS_CLEANUP_RESULT="+JSON.stringify(results));
          NODE
