name: Access Gateway Accessibility
on:
  pull_request:
    branches: [main]
    paths:
      - "auth/auth.html"
      - "auth.html"
      - "js/auth.js"
      - "js/auth-access.js"
      - "css/**"
      - "production-ready.js"
      - "tests/access-gateway-browser.mjs"
      - "tests/google-auth-browser.mjs"
      - "tests/account-controls-browser.mjs"
      - "tests/admin-traffic-browser.mjs"
      - "admin-traffic.html"
      - "js/admin-traffic-ui.js"
      - "js/account-controls.js"
      - "js/account-session.js"
      - "css/account-controls.css"
      - ".github/workflows/access-gateway-browser.yml"
  push:
    branches: [main]
    paths:
      - "auth/auth.html"
      - "auth.html"
      - "js/auth.js"
      - "js/auth-access.js"
      - "tests/access-gateway-browser.mjs"
      - "tests/google-auth-browser.mjs"
      - "tests/account-controls-browser.mjs"
      - "tests/admin-traffic-browser.mjs"
      - "admin-traffic.html"
      - "js/admin-traffic-ui.js"
      - "js/account-controls.js"
      - "js/account-session.js"
      - "css/account-controls.css"
      - ".github/workflows/access-gateway-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      # These smoke tests launch only headless Chromium. The full --with-deps
      # installation downloads large OS font packages and has timed out on
      # GitHub-hosted Ubuntu mirrors; use the runner's existing system libraries.
      - name: Cache Playwright headless Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-chromium-1.56.1
      - name: Install Playwright headless Chromium
        run: npx playwright install chromium --only-shell
      - name: Start portal
        run: |
          python3 -m http.server 4173 > /tmp/gateway-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/auth/auth.html > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check labels, keyboard tabs and responsive layout
        run: node tests/access-gateway-browser.mjs
      - name: Check Google profile and approval flows with Firebase mocks
        run: node tests/google-auth-browser.mjs
      - name: Check account controls and logout across mobile and desktop sections
        run: node tests/account-controls-browser.mjs
      - name: Check internal traffic reports and logout clearing
        run: node tests/admin-traffic-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-gateway-evidence
          path: artifacts/access-gateway
          retention-days: 30
