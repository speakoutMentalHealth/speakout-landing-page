name: Home Learning Firestore emulator
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules.emulator.test.mjs'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14
      - name: Verify Firebase CLI
        run: firebase --version
      - name: Test Firestore security rules in emulator
        run: npm run test:rules
