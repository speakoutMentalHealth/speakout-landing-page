name: Home Learning Firestore emulator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules.emulator.test.mjs'
      - 'tests/home-learning-backend.emulator.test.mjs'
      - 'functions/home-learning-manifest-ingestion.js'
      - 'functions/home-learning-manifest-callable.js'
      - 'functions/home-learning-staging-gate.js'
      - 'tests/phase128-staging-project-gate.test.mjs'
      - 'functions/home-learning-pinned-source.js'
      - 'functions/index.js'
      - 'functions/home-learning-manifest-candidate-store.js'
      - 'functions/home-learning-manifest-validator.js'
      - 'functions/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/home-learning-firestore-emulator.yml'
  pull_request:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules.emulator.test.mjs'
      - 'tests/home-learning-backend.emulator.test.mjs'
      - 'functions/home-learning-manifest-ingestion.js'
      - 'functions/home-learning-manifest-callable.js'
      - 'functions/home-learning-staging-gate.js'
      - 'tests/phase128-staging-project-gate.test.mjs'
      - 'functions/home-learning-pinned-source.js'
      - 'functions/index.js'
      - 'functions/home-learning-manifest-candidate-store.js'
      - 'functions/home-learning-manifest-validator.js'
      - 'functions/package.json'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Firebase Admin SDK for backend integration tests
        run: npm install --prefix functions --no-package-lock --no-audit --no-fund
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14
      - name: Verify Firebase CLI
        run: firebase --version
      - name: Test Firestore security rules in emulator
        run: npm run test:rules
