name: Firebase Hosting Storage Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firebase-hosting-storage-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup:
    name: Prune old Firebase Hosting versions
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workers/platform-api
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAAKOUT_PORTAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/platform-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Keep current plus four rollback versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { importPKCS8, SignJWT } from "jose";

          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          if(!sa.client_email||!sa.private_key)throw new Error("Firebase service account unavailable.");
          const now=Math.floor(Date.now()/1000);
          const key=await importPKCS8(String(sa.private_key).replace(/\\n/g,"\n"),"RS256");
          const assertion=await new SignJWT({scope:"https://www.googleapis.com/auth/cloud-platform"})
            .setProtectedHeader({alg:"RS256",typ:"JWT"})
            .setIssuer(sa.client_email)
            .setAudience("https://oauth2.googleapis.com/token")
            .setIssuedAt(now).setExpirationTime(now+3600).sign(key);
          const tokenResponse=await fetch("https://oauth2.googleapis.com/token",{
            method:"POST",
            headers:{"content-type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion})
          });
          if(!tokenResponse.ok)throw new Error("OAuth failed: "+tokenResponse.status);
          const {access_token}=await tokenResponse.json();
          const headers={authorization:"Bearer "+access_token,"content-type":"application/json"};
          const site="speaakout-portal";
          const api="https://firebasehosting.googleapis.com/v1beta1";

          async function request(url,options={}){
            const r=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});
            const text=await r.text();
            let body=null;
            try{body=text?JSON.parse(text):null}catch{body=text}
            return {ok:r.ok,status:r.status,body};
          }
          async function must(url,options={}){
            const r=await request(url,options);
            if(!r.ok)throw new Error(r.status+" "+JSON.stringify(r.body));
            return r.body;
          }
          async function listVersions(){
            let token="",rows=[];
            do{
              const u=new URL(`${api}/sites/${site}/versions`);
              u.searchParams.set("pageSize","100");
              if(token)u.searchParams.set("pageToken",token);
              const body=await must(u);
              rows.push(...(body.versions||[]));
              token=body.nextPageToken||"";
            }while(token);
            return rows;
          }

          const live=await must(`${api}/sites/${site}/channels/live`);
          const currentVersion=live?.release?.version?.name||"";
          if(!currentVersion)throw new Error("Could not identify the current live Hosting version.");

          const retention=await must(
            `${api}/sites/${site}/channels/live?updateMask=retainedReleaseCount`,
            {method:"PATCH",body:JSON.stringify({
              name:`sites/${site}/channels/live`,
              retainedReleaseCount:5
            })}
          );

          const before=await listVersions();
          const active=before
            .filter(v=>v.status!=="DELETED")
            .sort((a,b)=>String(b.createTime||"").localeCompare(String(a.createTime||"")));

          const keep=new Set([currentVersion]);
          for(const v of active){
            if(keep.size>=5)break;
            keep.add(v.name);
          }
          if(!keep.has(currentVersion))throw new Error("Safety check failed: current version is not in keep set.");

          const targets=active.filter(v=>!keep.has(v.name));
          const results=[];
          for(const version of targets){
            if(version.name===currentVersion)throw new Error("Safety check blocked deletion of current live version.");
            const r=await request(`${api}/${version.name}`,{method:"DELETE"});
            if(r.ok||r.status===404){
              results.push({name:version.name,status:r.status,deleted:true,bytes:Number(version.versionBytes||0)});
            }else{
              results.push({name:version.name,status:r.status,deleted:false,error:r.body,bytes:Number(version.versionBytes||0)});
            }
          }

          const after=await listVersions();
          const activeAfter=after.filter(v=>v.status!=="DELETED");
          const activeBytes=activeAfter.reduce((sum,v)=>sum+Number(v.versionBytes||0),0);
          const failed=results.filter(x=>!x.deleted);
          const summary={
            currentVersion,
            retainedReleaseCount:retention?.retainedReleaseCount??null,
            beforeActive:active.length,
            kept:[...keep],
            deleteTargets:targets.length,
            deleteSucceeded:results.filter(x=>x.deleted).length,
            deleteFailed:failed.length,
            activeAfter:activeAfter.length,
            activeVersionBytesAfter:activeBytes,
            activeVersionGiBAfter:Number((activeBytes/1073741824).toFixed(3)),
            failed:failed.slice(0,10)
          };
          console.log("HOSTING_STORAGE_CLEANUP="+JSON.stringify(summary));
          if(failed.length)throw new Error("Some old Hosting versions could not be deleted.");
          NODE
