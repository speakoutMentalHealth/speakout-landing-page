<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Courses | SpeakOut Portal</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard-shared.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
<a class="brand" href="student-dashboard.html"><img src="logo.png" alt="SpeakOut"><div>SpeakOut<small>Portal Dashboard</small></div></a>
<button class="menu" onclick="document.body.classList.toggle('menu-open')">☰</button>
<nav class="nav-links">
<a class="btn soft" href="student-dashboard.html">Student</a>
<a class="btn soft" href="school-dashboard.html">School</a>
<a class="btn soft" href="my-library.html">Library</a>
<a class="btn soft" href="my-courses.html">Courses</a>
<a class="btn soft" href="progress.html">Progress</a>
<a class="btn soft" href="certificates.html">Certificates</a>
<a class="btn soft" href="profile.html">Profile</a>
<button class="btn dark" id="logoutBtn">Logout</button>
</nav></div></header>
<main>
<section class="hero"><div class="container"><span class="kicker">Approved Portal Access</span><h1>My Courses</h1><p>Access SpeakHub training programs and skill development courses.</p></div></section>

<section><div class="container grid g3"><div class="card metric"><strong id="total">0</strong><span>Courses</span></div><div class="card metric"><strong id="digital">0</strong><span>Digital Skills</span></div><div class="card metric"><strong id="leadership">0</strong><span>Leadership</span></div></div></section>
<section><div class="container"><div class="panel"><span class="label">SpeakHub Courses</span><div class="controls"><input id="search" placeholder="Search courses..."><select id="category"><option value="all">All Categories</option></select><button class="btn ghost" id="reset">Reset</button></div></div><div class="grid g3" id="cards" style="margin-top:14px"></div></div></section>

</main>
<footer class="footer"><div class="container">SpeakOut Portal • <a href="index.html">Back Home</a></div></footer>
<script type="module" src="auth-guard.js"></script>
<script type="module">
import { SO } from "./dashboard-shared.js";

let courses=[];async function load(){courses=await SO.getAll("courses");total.textContent=SO.num(courses.length);digital.textContent=SO.num(courses.filter(c=>c.category==="Digital Skills").length);leadership.textContent=SO.num(courses.filter(c=>c.category==="Leadership").length);[...new Set(courses.map(c=>c.category).filter(Boolean))].forEach(c=>category.innerHTML+=`<option>${c}</option>`);render()}
function render(){let q=search.value.toLowerCase();let out=courses.filter(c=>(category.value==="all"||c.category===category.value)&&`${c.title} ${c.category} ${c.level}`.toLowerCase().includes(q));cards.innerHTML=out.length?out.map(c=>`<article class="card"><div class="icon">🎓</div><span class="label">${SO.safe(c.category)}</span><h2>${SO.safe(c.title)}</h2><p>${SO.safe(c.description)}</p><p><strong>${SO.safe(c.level)}</strong> • ${SO.safe(c.duration)}</p><a class="btn primary" href="${c.courseUrl||'#'}" target="_blank">Start Course</a></article>`).join(""):`<div class="notice"><h3>No courses found.</h3><p>Admin needs to add courses from admin-courses.html.</p></div>`}
search.oninput=render;category.onchange=render;reset.onclick=()=>{search.value="";category.value="all";render()};load();

</script>
</body></html>
