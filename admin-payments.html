<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Payments | SpeakOut</title>

<link rel="icon" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
--navy:#07152b;
--blue:#0a5fbf;
--soft:#eaf3ff;
--gold:#f4a21c;
--green:#0f8f6f;
--greenSoft:#e9fbf5;
--red:#991b1b;
--redSoft:#fee2e2;
--goldSoft:#fff4df;
--muted:#637083;
--line:#e5edf6;
--bg:#f7f9fc;
--shadow:0 18px 44px rgba(7,21,43,.10)
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Outfit,sans-serif;
background:var(--bg);
color:#111827
}

.container{
width:min(1220px,92%);
margin:auto
}

.nav{
background:#fff;
border-bottom:1px solid var(--line);
position:sticky;
top:0;
z-index:100
}

.nav-inner{
min-height:72px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.brand img{
width:44px
}

.brand h2{
margin:0;
color:var(--blue)
}

.brand p{
margin:0;
font-size:.62rem;
font-weight:900;
color:#d98200
}

.links{
display:flex;
gap:8px
}

.btn{
border:0;
border-radius:999px;
padding:10px 15px;
font-weight:900;
cursor:pointer;
display:inline-flex;
align-items:center;
justify-content:center
}

.primary{
background:var(--blue);
color:#fff
}

.soft{
background:var(--soft);
color:var(--blue)
}

.success{
background:var(--greenSoft);
color:var(--green)
}

.danger{
background:var(--redSoft);
color:var(--red)
}

.dark{
background:var(--navy);
color:#fff
}

.hero{
background:linear-gradient(135deg,var(--navy),var(--blue));
color:#fff
}

.hero .container{
padding:50px 0
}

.hero h1{
font-size:clamp(2rem,5vw,4rem);
margin:10px 0
}

section{
padding:30px 0
}

.grid{
display:grid;
gap:16px
}

.g4{
grid-template-columns:repeat(4,1fr)
}

.card,.panel{
background:#fff;
border-radius:24px;
padding:18px;
border:1px solid var(--line);
box-shadow:var(--shadow)
}

.stat strong{
display:block;
font-size:2rem;
color:var(--blue)
}

.notice{
padding:14px;
border-radius:16px;
background:var(--soft);
color:var(--blue);
font-weight:900;
margin-bottom:15px
}

.ok{
background:var(--greenSoft);
color:var(--green)
}

.bad{
background:var(--redSoft);
color:var(--red)
}

input,select{
width:100%;
padding:12px;
border-radius:14px;
border:1px solid var(--line)
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.table{
width:100%;
border-collapse:collapse
}

.table th,
.table td{
padding:12px;
text-align:left;
border-bottom:1px solid var(--line)
}

.pill{
display:inline-block;
padding:6px 10px;
border-radius:999px;
font-size:.75rem;
font-weight:900
}

.pending{
background:var(--goldSoft);
color:#704800
}

.approved{
background:var(--greenSoft);
color:var(--green)
}

.rejected{
background:var(--redSoft);
color:var(--red)
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
padding:40px;
overflow:auto
}

.modal-content{
background:#fff;
max-width:700px;
margin:auto;
padding:25px;
border-radius:24px
}

@media(max-width:1000px){

.g4,.form-grid{
grid-template-columns:1fr
}

.links{
display:none
}

}

</style>
</head>

<body>

<header class="nav">
<div class="container nav-inner">

<div class="brand">
<img src="logo.png">
<div>
<h2>SpeakOut</h2>
<p>Admin Payments</p>
</div>
</div>

<nav class="links">
<a class="btn soft" href="admin-dashboard.html">Dashboard</a>
<a class="btn soft" href="admin-users.html">Users</a>
<a class="btn soft" href="admin-content-review.html">Content</a>
<a class="btn dark" href="portal.html">Portal</a>
</nav>

</div>
</header>

<section class="hero">
<div class="container">
<h1>Payment Management</h1>
<p>Review payment evidence, approve access and manage transactions.</p>
</div>
</section>

<section>
<div class="container">

<div id="statusBox" class="notice">
Loading payments...
</div>

<div class="grid g4">

<div class="card stat">
<strong id="totalPayments">0</strong>
<span>Total Payments</span>
</div>

<div class="card stat">
<strong id="approvedPayments">0</strong>
<span>Approved</span>
</div>

<div class="card stat">
<strong id="pendingPayments">0</strong>
<span>Pending</span>
</div>

<div class="card stat">
<strong id="rejectedPayments">0</strong>
<span>Rejected</span>
</div>

</div>

<div class="panel" style="margin-top:18px">

<div class="form-grid">

<input id="searchInput" placeholder="Search payments">

<select id="statusFilter">
<option value="all">All Status</option>
<option value="pending">Pending</option>
<option value="approved">Approved</option>
<option value="rejected">Rejected</option>
</select>

</div>

</div>

<div class="panel" style="margin-top:18px">

<div style="overflow:auto">

<table class="table">

<thead>
<tr>
<th>Payer</th>
<th>Item</th>
<th>Amount</th>
<th>Reference</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>

</div>
</section>

<div id="paymentModal" class="modal">

<div class="modal-content">

<h2>Payment Details</h2>

<div id="paymentDetails"></div>

<div style="margin-top:20px">

<a id="proofLink"
class="btn primary"
target="_blank">
View Evidence
</a>

<button
class="btn dark"
onclick="paymentModal.style.display='none'">
Close
</button>

</div>

</div>

</div>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
collection,
onSnapshot,
doc,
updateDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

let PAYMENTS=[];

function render(){

const s=searchInput.value.toLowerCase();
const sf=statusFilter.value;

const filtered=PAYMENTS.filter(p=>{

const txt=`
${p.payerName||""}
${p.email||""}
${p.reference||""}
${p.itemTitle||""}
`.toLowerCase();

return (!s||txt.includes(s))
&&
(sf==="all"||p.status===sf);

});

rows.innerHTML=filtered.map(p=>`

<tr>

<td>${p.payerName||"Unknown"}</td>

<td>${p.itemTitle||"Payment"}</td>

<td>${p.currency||"₦"}${Number(p.amount||0).toLocaleString()}</td>

<td>${p.reference||"-"}</td>

<td>
<span class="pill ${p.status}">
${p.status}
</span>
</td>

<td>

<button class="btn soft"
onclick="viewPayment('${p.id}')">
View
</button>

<button class="btn success"
onclick="updatePayment('${p.id}','approved')">
Approve
</button>

<button class="btn danger"
onclick="updatePayment('${p.id}','rejected')">
Reject
</button>

</td>

</tr>

`).join("");

}

window.viewPayment=id=>{

const p=PAYMENTS.find(x=>x.id===id);

paymentDetails.innerHTML=`

<p><b>Name:</b> ${p.payerName}</p>
<p><b>Email:</b> ${p.email}</p>
<p><b>Amount:</b> ${p.currency||"₦"}${p.amount}</p>
<p><b>Reference:</b> ${p.reference}</p>
<p><b>Item:</b> ${p.itemTitle}</p>

`;

proofLink.href=p.proofUrl||"#";

paymentModal.style.display="block";

};

window.updatePayment=async(id,status)=>{

await updateDoc(
doc(db,"payments",id),
{
status,
updatedAt:serverTimestamp()
}
);

};

onSnapshot(collection(db,"payments"),snap=>{

PAYMENTS=[];

snap.forEach(d=>{

PAYMENTS.push({
id:d.id,
...d.data()
});

});

totalPayments.textContent=PAYMENTS.length;

approvedPayments.textContent=
PAYMENTS.filter(x=>x.status==="approved").length;

pendingPayments.textContent=
PAYMENTS.filter(x=>x.status==="pending").length;

rejectedPayments.textContent=
PAYMENTS.filter(x=>x.status==="rejected").length;

render();

statusBox.textContent="Payments loaded.";

});

searchInput.addEventListener("input",render);
statusFilter.addEventListener("change",render);

</script>

</body>
</html>
