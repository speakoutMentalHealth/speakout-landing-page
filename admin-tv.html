<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakOut TV Admin</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link href="css/portal-ui.css" rel="stylesheet"><link href="css/admin-cms.css" rel="stylesheet"><link href="css/production-ready.css" rel="stylesheet"></head><body><script type="module">import {requireRoles} from "./launch-role-guard.js";requireRoles(["admin","super_admin"]);</script><main><section class="hero"><div class="container"><span class="kicker">SpeakOut TV</span><h1>TV Publishing</h1><p>Publish episodes without editing website code.</p></div></section><section><div class="container admin-layout"><aside class="side"><h3>TV Admin</h3><a class="btn soft" href="admin-tv.html">Episodes</a><a class="btn soft" href="admin-media.html">Media</a><a class="btn soft" href="admin-podcast.html">Podcasts</a><a class="btn dark" href="tv.html">Open SpeakOut TV</a></aside><div><div class="notice" id="statusBox">Checking administrator access...</div><div class="panel"><span class="label">Create / Update Episode</span><form class="form-grid" id="cmsForm"><input id="title" placeholder="Episode title" required><input id="show" placeholder="Show name"><input id="description" placeholder="Short description"><input id="url" placeholder="YouTube / YouTube Live URL" required><input id="imageUrl" placeholder="Thumbnail URL"><select id="format"><option value="episode">Full episode</option><option value="short">Short / highlight</option><option value="live">Live / special</option></select><select id="status"><option value="draft">draft</option><option value="published">published</option><option value="hidden">hidden</option></select><select id="featured"><option value="false">Standard</option><option value="true">Featured</option></select><input id="order" placeholder="Order" type="number"><button class="btn primary" type="submit">Save Episode</button></form></div><div class="panel" style="margin-top:18px"><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Status</th><th>Order</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div></section></main><script type="module">import {createAdminCmsController} from "./js/admin-cms-ui.js";createAdminCmsController({collectionName:"tvEpisodes",fieldIds:["title","show","description","url","imageUrl","format","status","featured","order"]});</script><script defer src="portal-ui.js"></script></body></html>
