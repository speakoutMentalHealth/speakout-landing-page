<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book Reader | SpeakOut</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#07152b;--blue:#0a5fbf;--bg:#f7f9fc;--line:#e5edf6;--muted:#637083}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}.header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10}.inner{width:min(980px,92%);margin:auto;padding:14px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}.btn{border:0;border-radius:999px;padding:9px 14px;background:var(--blue);color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.wrap{width:min(980px,92%);margin:26px auto}.book{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;line-height:1.75;box-shadow:0 16px 44px rgba(7,21,43,.08)}h1,h2,h3{color:var(--navy);line-height:1.08}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.muted{color:var(--muted)}.darkmode{background:#061126;color:#e6edf5}.darkmode .book,.darkmode .header{background:#07152b;color:#e6edf5;border-color:#203656}.darkmode h1,.darkmode h2,.darkmode h3{color:#fff}</style></head><body><div class="header"><div class="inner"><a href="e-library.html" class="btn">← E-Library</a><strong id="topTitle">Book Reader</strong><button class="btn" onclick="document.body.classList.toggle('darkmode')">Dark Mode</button></div></div><div class="wrap"><div id="status" class="book">Loading book...</div><div class="controls"><button class="btn" id="prevBtn">Previous</button><button class="btn" id="nextBtn">Next</button><button class="btn" onclick="window.print()">Download / Print PDF</button></div><article id="reader" class="book" style="display:none"></article></div><script type="module" src="auth-guard.js"></script><script type="module" src="protected-page-guard.js"></script><script type="module">import{db}from"./firebase-config.js";import{doc,getDoc}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const id=new URLSearchParams(location.search).get("id");let book=null,chapter=0;const status=document.getElementById("status"),reader=document.getElementById("reader");function render(){const chapters=book.chapters||[];const current=chapters[chapter]||{title:book.title,contentHtml:book.contentHtml||"<p>No chapter content yet.</p>"};document.getElementById("topTitle").textContent=book.title;reader.innerHTML=`<h1>${book.title}</h1><p class="muted">${book.author||""} • ${book.category||""}</p><hr><h2>${current.title}</h2>${current.contentHtml}`;status.style.display="none";reader.style.display="block";document.getElementById("prevBtn").disabled=chapter===0;document.getElementById("nextBtn").disabled=chapter>=chapters.length-1}document.getElementById("prevBtn").onclick=()=>{if(chapter>0){chapter--;render()}};document.getElementById("nextBtn").onclick=()=>{if(book&&chapter<(book.chapters||[]).length-1){chapter++;render()}};async function load(){if(!id){status.textContent="No book selected.";return}const snap=await getDoc(doc(db,"books",id));if(!snap.exists()){status.textContent="Book not found.";return}book={id:snap.id,...snap.data()};render()}load().catch(e=>{status.textContent="Could not load book. Check Firestore rules.";console.error(e)});</script></body></html>
