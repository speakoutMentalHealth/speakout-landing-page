<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MindCheck adult access</title><style>body{font:17px system-ui;background:#f3f8f5;color:#174632;max-width:440px;margin:32px auto;padding:20px}input,button{box-sizing:border-box;font:inherit;padding:12px;border-radius:10px;margin:8px 0;max-width:100%}input[type=email],input[type=password],button{width:100%}button{background:#185b43;color:white;border:0;min-height:44px}label{display:block;margin-top:12px}a{color:#185b43}</style></head><body><main><h1>MindCheck adult access</h1><p>Sign in with your approved SpeakOut account. AI pilot eligibility is reviewed separately.</p><section id="signIn"><button id="google">Sign in with Google</button><form id="emailForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><section id="access" hidden><p id="account"></p><label><input id="consent" type="checkbox"> I agree to use AI for platform-help explanations. Only the selected topic and language are sent, not my diary or assessment answers. AI can make mistakes.</label><button id="continue">Continue to MindCheck</button><button id="logout">Sign out</button></section><p id="status" role="status" aria-live="polite"></p><a href="https://mindcheck.speakoutmentalhealth.org/">Back to MindCheck</a></main><script type="module" src="js/mindcheck-access.js"></script></body></html>
