<!DOCTYPE html>

<html lang="en">
<head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Secure SpeakHub Assessments</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f9fc;margin:0;padding:40px;color:#111827}
.box{max-width:760px;margin:auto;background:white;padding:28px;border-radius:20px;box-shadow:0 16px 40px #0001}
button{background:#0a5fbf;color:white;border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer}
pre{white-space:pre-wrap;background:#eef6ff;padding:16px;border-radius:14px}
</style><link href="css/production-ready.css" rel="stylesheet"/><script defer="True" src="production-ready.js"></script><meta content="#123f91" name="theme-color"/></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a><div class="box">
<h1>Secure SpeakHub Assessments</h1>
<p>Run this once while signed in as an approved admin. It moves quiz/final answer keys into the private <code>courseAssessments</code> collection and removes answer keys from public course documents.</p>
<button id="run">Secure Assessments</button>
<pre id="status">Ready.</pre>
</div>
<script type="module">
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-functions.js";
import "./firebase-config.js";
const fn=httpsCallable(getFunctions(),"syncCourseAssessments");
document.getElementById("run").onclick=async()=>{
 const s=document.getElementById("status");s.textContent="Running...";
 try{const r=await fn({});s.textContent=JSON.stringify(r.data,null,2)}
 catch(e){console.error(e);s.textContent=e.message||"Migration failed."}
};
</script></body></html>
