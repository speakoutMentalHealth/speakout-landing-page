<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress | SpeakOut Portal</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard-shared.css">
<link rel="stylesheet" href="css/portal-ui.css">
</head>
<body>
<header class="nav"><div class="container nav-inner">
<a class="brand" href="student-dashboard.html"><img src="logo.png" alt="SpeakOut"><div>SpeakOut<small>Portal Dashboard</small></div></a>
<button class="menu" onclick="document.body.classList.toggle('menu-open')">☰</button>
<nav class="nav-links">
<a class="btn soft" href="student-dashboard.html">Student</a>
<a class="btn soft" href="school-dashboard.html">School</a>
<a class="btn soft" href="my-library.html">Library</a>
<a class="btn soft" href="my-courses.html">Courses</a>
<a class="btn soft" href="progress.html">Progress</a>
<a class="btn soft" href="certificates.html">Certificates</a>
<a class="btn soft" href="profile.html">Profile</a>
<button class="btn dark" id="logoutBtn">Logout</button>
</nav></div></header>
<main>
<section class="hero"><div class="container"><span class="kicker">Approved Portal Access</span><h1>My Progress</h1><p>Track your learning progress, course status and completion history.</p></div></section>

<section><div class="container grid g3"><div class="card metric"><strong id="total">0</strong><span>Records</span></div><div class="card metric"><strong id="done">0</strong><span>Completed</span></div><div class="card metric"><strong id="avg">0%</strong><span>Average Progress</span></div></div></section>
<section><div class="container"><div class="panel"><span class="label">My Progress</span><div class="table-wrap"><table><thead><tr><th>Course</th><th>Status</th><th>Progress</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section>

</main>
<footer class="footer"><div class="container">SpeakOut Portal • <a href="index.html">Back Home</a></div></footer>
<script type="module" src="auth-guard.js"></script>
<script type="module">
import { SO } from "./dashboard-shared.js";

SO.onAuthStateChanged(SO.auth, async user=>{if(!user)return;const rowsData=await SO.getMine("userProgress","userEmail",user.email);total.textContent=SO.num(rowsData.length);done.textContent=SO.num(rowsData.filter(r=>r.status==="completed").length);avg.textContent=(rowsData.length?Math.round(rowsData.reduce((a,r)=>a+Number(r.percent||0),0)/rowsData.length):0)+"%";rows.innerHTML=rowsData.length?rowsData.map(r=>`<tr><td>${SO.safe(r.courseTitle)}</td><td>${SO.badge(r.status)}</td><td><div class="progress-track"><div class="progress-fill" style="width:${Number(r.percent||0)}%"></div></div> ${SO.num(r.percent)}%</td><td>${SO.safe(r.updatedAt)}</td></tr>`).join(""):`<tr><td colspan="4">No progress records yet.</td></tr>`});

</script>
<script src="portal-ui.js" defer></script>
</body></html>
