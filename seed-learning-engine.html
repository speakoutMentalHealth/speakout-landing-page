<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Seed SpeakOut Learning Engine</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&amp;display=swap" rel="stylesheet"/><style>body{margin:0;font-family:Outfit,Arial,sans-serif;background:#f7f9fc;color:#111827}.wrap{width:min(820px,92%);margin:60px auto;background:#fff;border:1px solid #e5edf6;border-radius:24px;padding:28px;box-shadow:0 16px 44px rgba(7,21,43,.08)}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1;margin:0 0 14px;color:#07152b}p{color:#637083;line-height:1.65}button{border:0;border-radius:999px;background:#0a5fbf;color:#fff;font-weight:900;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}.box{margin-top:16px;padding:14px;border-radius:14px;background:#eaf3ff;color:#0a5fbf;font-weight:800;white-space:pre-line}.ok{background:#e9fbf5;color:#0f8f6f}.bad{background:#fff1f0;color:#b42318}.warn{background:#fff4df;color:#704800}</style><link href="css/production-ready.css" rel="stylesheet"/><script defer="True" src="production-ready.js"></script><meta content="#123f91" name="theme-color"/></head><body><a class="skip-link" href="#main-content">Skip to main content</a><div class="wrap"><h1>Seed SpeakOut Learning Engine</h1><p>This installs original books, courses, lessons, quizzes and Kiddies resources into Firestore.</p><button disabled="" id="seedButton">Seed Learning Engine</button><div class="box" id="seedStatus">Checking admin access...</div><div class="box ok" id="seedResult" style="display:none"></div><div class="box warn">Run once. After success, remove this page from public hosting or keep it admin-only.</div></div><script src="seed-learning-engine.js" type="module"></script><script type="module">document.getElementById("seedButton").addEventListener("click",async()=>{const r=document.getElementById("seedResult");r.style.display="block";r.className="box ok";r.textContent="Installing content...";try{const o=await window.seedLearningEngine();r.textContent=`Done.\nBooks: ${o.books}\nCourses: ${o.courses}\nLessons: ${o.lessons}\nQuizzes: ${o.quizzes}\nKiddies: ${o.kiddies}`}catch(e){r.className="box bad";r.textContent=e.message||"Seeding failed."}});</script></body></html>
