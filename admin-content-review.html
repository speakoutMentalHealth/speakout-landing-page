<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Review | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--goldSoft:#fff4df;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}a{text-decoration:none;color:inherit}.container{width:min(1220px,92%);margin:auto}.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}.brand h2{margin:0;color:var(--blue);font-size:1.05rem}.brand p{margin:0;color:#d98200;font-size:.62rem;font-weight:900}.links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer;min-height:40px}.primary{background:var(--blue);color:#fff}.soft{background:var(--soft);color:var(--blue)}.gold{background:var(--gold);color:#241300}.dark{background:var(--navy);color:#fff}.danger{background:var(--redSoft);color:var(--red)}.success{background:var(--greenSoft);color:var(--green)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:48px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.72rem;font-weight:900;text-transform:uppercase}.kicker{background:rgba(255,255,255,.14)}.label{background:var(--soft);color:var(--blue);margin-bottom:12px}h1{font-size:clamp(2rem,5vw,4.4rem);line-height:1.05;margin:14px 0}h2,h3{line-height:1.05;color:var(--navy)}.hero p{max-width:850px;color:rgba(255,255,255,.88);line-height:1.65}section{padding:34px 0}.grid{display:grid;gap:16px}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}.card p,.panel p{color:var(--muted);line-height:1.6}.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900;margin-bottom:16px}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.warn{background:var(--goldSoft);color:#704800}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.75rem;font-weight:900;margin:3px}.approved,.active{background:var(--greenSoft);color:var(--green)}.pending,.pending_school_approval{background:var(--goldSoft);color:#704800}.rejected,.suspended{background:var(--redSoft);color:var(--red)}.stat strong{display:block;color:var(--blue);font-size:2.25rem}.table{width:100%;border-collapse:separate;border-spacing:0 10px}.table th{text-align:left;color:var(--muted);font-size:.8rem;text-transform:uppercase}.table td,.table th{padding:10px}.row{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.actions{display:flex;gap:8px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:11px;font:inherit;background:#fbfdff}.footer{background:#061126;color:rgba(255,255,255,.75);padding:34px 0;margin-top:30px}@media(max-width:1000px){.g5,.g4,.g3,.g2,.form-grid{grid-template-columns:1fr}.links{display:none}.btn{width:100%;border-radius:14px}.actions{flex-direction:column}.table{font-size:.85rem}}
</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="admin-dashboard.html"><img src="logo.png"><div><h2>SpeakOut</h2><p>Admin Command Center</p></div></a><nav class="links"><a class="btn soft" href="admin-dashboard.html">Dashboard</a><a class="btn soft" href="admin-schools.html">Schools</a><a class="btn soft" href="admin-users.html">Users</a><a class="btn soft" href="admin-content-review.html">Content</a><a class="btn soft" href="admin-payments.html">Payments</a><a class="btn dark" href="portal.html">Portal</a></nav></div></header>
<main><section class="hero"><div class="container"><span class="kicker">Admin</span><h1>Content Review</h1><p>Review books and courses before publishing.</p></div></section>
<section><div class="container"><div id="statusBox" class="notice">Checking admin access...</div>
<div class="grid g2"><div class="panel"><span class="label">Books</span><h2>Book Review</h2><div id="booksBox"></div></div><div class="panel"><span class="label">Courses</span><h2>Course Review</h2><div id="coursesBox"></div></div></div>
</div></section></main><footer class="footer"><div class="container">SpeakOut Admin Command Center</div></footer><script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { collection, getDocs, query, where, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

window.ADM = { auth, db, collection, getDocs, query, where, doc, getDoc, updateDoc, serverTimestamp };

window.show = function(m,t=""){
 const el=document.getElementById("statusBox");
 if(el){ el.textContent=m; el.className="notice "+t; }
};

window.safe = function(v){ return v || "—"; };
window.pill = function(v){ return `<span class="pill ${(v||"").toLowerCase()}">${window.safe(v)}</span>`; };

window.requireAdmin = function(callback){
 onAuthStateChanged(auth, async user=>{
   if(!user){ location.href="auth.html"; return; }
   const snap=await getDoc(doc(db,"users",user.uid));
   if(!snap.exists()){ location.href="auth.html#pending"; return; }
   const profile={uid:user.uid,...snap.data()};
   const role=(profile.role||"").toLowerCase().trim();
   const status=(profile.status||"").toLowerCase().trim();

   if(status!=="approved"){ location.href="portal.html"; return; }

   if(role!=="admin" && role!=="super_admin"){
     location.href="portal.html";
     return;
   }

   callback(user,profile);
 });
};
</script>
<script type="module">
async function loadCol(col, box){
 const api=window.ADM;
 const snap=await api.getDocs(api.collection(api.db,col));
 let html="";
 snap.forEach(d=>{
   const item={id:d.id,...d.data()};
   html+=`<div class="card"><h3>${window.safe(item.title)}</h3><p>${window.safe(item.description)}</p>${window.pill(item.status||"pending")} ${window.pill(item.audience||"all")}<div class="actions"><button class="btn success" data-col="${col}" data-id="${item.id}" data-status="active">Publish</button><button class="btn danger" data-col="${col}" data-id="${item.id}" data-status="rejected">Reject</button><button class="btn soft" data-col="${col}" data-id="${item.id}" data-status="pending">Pending</button></div></div>`;
 });
 box.innerHTML=html||"<div class='notice warn'>No content found.</div>";
 box.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{
   const api=window.ADM;
   await api.updateDoc(api.doc(api.db,b.dataset.col,b.dataset.id),{status:b.dataset.status,updatedAt:api.serverTimestamp()});
   await loadAll();
 });
}
async function loadAll(){await loadCol("books",booksBox);await loadCol("courses",coursesBox);}
window.requireAdmin(async()=>{await loadAll();window.show("Content loaded.","ok");});
</script></body></html>
