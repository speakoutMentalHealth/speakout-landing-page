<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auth | SpeakOut Portal</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="speakout-style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><img src="logo.png"><div>SpeakOut<small>Portal Access</small></div></a><button class="menu" onclick="document.body.classList.toggle('menu-open')">☰</button><nav class="nav-links"><a class="btn soft" href="index.html">Home</a><a class="btn dark" href="#login">Login</a><a class="btn gold" href="#register">Apply</a></nav></div></header><main><section class="hero"><div class="container"><span class="kicker">Access</span><h1>Login or Apply</h1><p>New users are created as pending until approved by SpeakOut.</p></div></section><section><div class="container grid g2"><div class="panel" id="login"><span class="label">Login</span><h2>Welcome back</h2><form class="form-grid" id="loginForm"><input class="full" id="loginEmail" type="email" placeholder="Email" required><input class="full" id="loginPassword" type="password" placeholder="Password" required><button class="btn primary full">Login</button></form><div id="loginMsg" class="message"></div></div><div class="panel" id="register"><span class="label">Apply Access</span><h2>Create account</h2><form class="form-grid" id="registerForm"><input id="fullName" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone / WhatsApp"><select id="role" required><option value="">Select role</option><option value="student">Student</option><option value="school">School</option><option value="teacher">Teacher</option><option value="parent">Parent</option><option value="ambassador">Ambassador</option></select><input id="schoolName" placeholder="School / Organization"><input id="location" placeholder="Location / State"><input id="password" type="password" placeholder="Password" required><input id="confirmPassword" type="password" placeholder="Confirm password" required><textarea class="full" id="reason" placeholder="Why do you need access?"></textarea><button class="btn gold full">Submit Application</button></form><div id="regMsg" class="message"></div></div></div></section><section id="pending"><div class="container"><div class="notice"><span class="label">Pending Approval</span><h3>If your account is pending</h3><p>Wait for SpeakOut admin approval. Contact WhatsApp if urgent.</p></div></div></section></main><script type="module">import{auth,db}from'./firebase-config.js';import{signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,signOut}from'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';const msg=(id,t,ok=true)=>{const e=document.getElementById(id);e.textContent=t;e.className='message '+(ok?'ok':'bad');e.style.display='block'};async function route(user){const s=await getDoc(doc(db,'users',user.uid));if(!s.exists()){location.href='auth.html#pending';return}const p=s.data();if(p.status!=='approved'){location.href='auth.html#pending';return}location.href=p.role==='admin'?'admin.html':'portal.html'}loginForm.onsubmit=async e=>{e.preventDefault();try{const r=await signInWithEmailAndPassword(auth,loginEmail.value,loginPassword.value);msg('loginMsg','Login successful.');route(r.user)}catch(err){msg('loginMsg','Login failed.',false)}};registerForm.onsubmit=async e=>{e.preventDefault();if(password.value!==confirmPassword.value){msg('regMsg','Passwords do not match.',false);return}try{const r=await createUserWithEmailAndPassword(auth,email.value,password.value);await updateProfile(r.user,{displayName:fullName.value});await setDoc(doc(db,'users',r.user.uid),{uid:r.user.uid,fullName:fullName.value,email:email.value,phone:phone.value,role:role.value,status:'pending',schoolName:schoolName.value,location:location.value,reason:reason.value,createdAt:serverTimestamp()});await signOut(auth);msg('regMsg','Application submitted. Wait for approval.')}catch(err){msg('regMsg','Registration failed.',false)}};</script></body></html>
