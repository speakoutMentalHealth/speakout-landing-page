<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Course Viewer | SpeakHub</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#07152b;--blue:#0a5fbf;--bg:#f7f9fc;--line:#e5edf6;--muted:#637083;--green:#0f8f6f}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}.header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10}.inner{width:min(1100px,92%);margin:auto;padding:14px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}.btn{border:0;border-radius:999px;padding:9px 14px;background:var(--blue);color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.wrap{width:min(1100px,92%);margin:26px auto;display:grid;grid-template-columns:300px 1fr;gap:16px}.side,.main{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 16px 44px rgba(7,21,43,.08)}.lesson{display:block;width:100%;text-align:left;margin:8px 0;padding:10px;border-radius:12px;border:1px solid var(--line);background:#f8fbff;cursor:pointer;font-weight:800}.lesson.active{background:var(--blue);color:#fff}h1,h2,h3{color:var(--navy);line-height:1.08}.muted{color:var(--muted)}.quiz{margin-top:18px;padding:16px;border-radius:16px;background:#e9fbf5;color:var(--green);font-weight:800}@media(max-width:850px){.wrap{grid-template-columns:1fr}.btn{border-radius:14px}}</style></head><body><div class="header"><div class="inner"><a href="speakhub.html" class="btn">← SpeakHub</a><strong id="topTitle">Course Viewer</strong><a class="btn" href="portal.html#certificates">Certificates</a></div></div><div class="wrap"><aside class="side"><h3>Lessons</h3><div id="lessonList">Loading...</div></aside><main class="main"><div id="status">Loading course...</div><article id="lessonBody" style="display:none"></article><div id="quizBox" class="quiz" style="display:none"></div></main></div><script type="module" src="auth-guard.js"></script><script type="module" src="protected-page-guard.js"></script><script type="module">import{db}from"./firebase-config.js";import{doc,getDoc,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const id=new URLSearchParams(location.search).get("id");let course=null,lessons=[],active=0;const lessonList=document.getElementById("lessonList"),body=document.getElementById("lessonBody"),status=document.getElementById("status");function render(){document.getElementById("topTitle").textContent=course.title;lessonList.innerHTML=lessons.map((l,i)=>`<button class="lesson ${i===active?"active":""}" onclick="selectLesson(${i})">${l.lessonNumber}. ${l.title}</button>`).join("");const l=lessons[active];body.innerHTML=`<h1>${course.title}</h1><p class="muted">${course.category} • ${course.difficulty} • ${course.duration}</p><hr><h2>${l.title}</h2>${l.contentHtml}<p><button class="btn" onclick="nextLesson()">Mark Complete / Next</button></p>`;status.style.display="none";body.style.display="block";if(active===lessons.length-1){document.getElementById("quizBox").style.display="block";document.getElementById("quizBox").innerHTML="Final lesson reached. Next: complete quiz and certificate pathway."}else document.getElementById("quizBox").style.display="none"}window.selectLesson=i=>{active=i;render()};window.nextLesson=()=>{if(active<lessons.length-1){active++;render()}else document.getElementById("quizBox").scrollIntoView({behavior:"smooth"})};async function load(){if(!id){status.textContent="No course selected.";return}const cSnap=await getDoc(doc(db,"courses",id));if(!cSnap.exists()){status.textContent="Course not found.";return}course={id:cSnap.id,...cSnap.data()};const q=query(collection(db,"lessons"),where("courseId","==",id));const lSnap=await getDocs(q);lessons=[];lSnap.forEach(d=>lessons.push({id:d.id,...d.data()}));lessons.sort((a,b)=>(a.lessonNumber||0)-(b.lessonNumber||0));if(!lessons.length){status.textContent="No lessons found for this course yet.";return}render()}load().catch(e=>{status.textContent="Could not load course. Check Firestore rules.";console.error(e)});</script></body></html>
