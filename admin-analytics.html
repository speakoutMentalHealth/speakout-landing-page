</head>
<body>
<header class="nav"><div class="container nav-inner">
<a class="brand" href="admin-dashboard.html"><img src="logo.png" alt="SpeakOut"><div>SpeakOut<small>Admin Control</small></div></a>
<button class="menu" onclick="document.body.classList.toggle('menu-open')">☰</button>
<nav class="nav-links">
<a class="btn soft" href="admin-dashboard.html">Home</a>

<main>
<section class="hero"><div class="container"><span class="kicker">Admin Area</span><h1>Admin Analytics</h1><p>Quick platform analytics for users, schools, activities and revenue.</p></div></section>

<section><div class="container grid g4"><div class="card metric"><strong id="users">0</strong><span>Users</span></div><div class="card metric"><strong id="schools">0</strong><span>Schools</span></div><div class="card metric"><strong id="activities">0</strong><span>Activities</span></div><div class="card metric"><strong id="revenue">₦0</strong><span>Revenue</span></div></div></section>
<section><div class="container grid g2"><div class="panel"><span class="label">User Roles</span><div id="bars1"></div></div><div class="panel"><span class="label">Activity Status</span><div id="bars2"></div></div></div></section>

</main>
<footer class="footer"><div class="container">SpeakOut Admin • <a href="index.html">Back Home</a></div></footer>
<script type="module" src="auth-guard.js"></script>
<script type="module">
import { SO } from "./admin-shared.js";

async function load(){const [u,s,a,p]=await Promise.all([SO.getAll("users"),SO.getAll("schools"),SO.getAll("activities"),SO.getAll("schoolPayments")]);users.textContent=SO.num(u.length);schools.textContent=SO.num(s.length);activities.textContent=SO.num(a.length);revenue.textContent=SO.money(p.filter(x=>x.status==="paid").reduce((n,x)=>n+Number(x.amount||0),0));SO.bars("bars1",SO.by(u,"role"));SO.bars("bars2",SO.by(a,"status"))}load();

</script>
</body>
