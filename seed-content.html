<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed SpeakOut Content</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Outfit,Arial,sans-serif;background:#f7f9fc;color:#111827}
.wrap{width:min(760px,92%);margin:60px auto;background:#fff;border:1px solid #e5edf6;border-radius:24px;padding:28px;box-shadow:0 16px 44px rgba(7,21,43,.08)}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1;margin:0 0 14px;color:#07152b}
p{color:#637083;line-height:1.6}
button{border:0;border-radius:999px;background:#0a5fbf;color:#fff;font-weight:900;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:16px;padding:14px;border-radius:14px;background:#eaf3ff;color:#0a5fbf;font-weight:800}
.result{margin-top:16px;padding:14px;border-radius:14px;background:#e9fbf5;color:#0f8f6f;font-weight:800;display:none}
.warn{background:#fff4df;color:#704800;padding:14px;border-radius:14px;margin-top:16px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <h1>Seed SpeakOut Starter Content</h1>
  <p>This installs preloaded content into Firestore: 80 books, 100 courses, and 20 Kiddies resources. Run it once as an approved admin.</p>
  <button id="seedButton" disabled>Seed Starter Content</button>
  <div class="status" id="seedStatus">Checking admin access...</div>
  <div class="result" id="seedResult"></div>
  <div class="warn">After seeding successfully, you may remove this file from GitHub to avoid confusion.</div>
</div>

<script type="module" src="seed-content.js"></script>
<script type="module">
document.getElementById("seedButton").addEventListener("click", async () => {
  const result = document.getElementById("seedResult");
  result.style.display = "block";
  result.textContent = "Installing starter content...";
  try{
    const output = await window.seedSpeakOutContent();
    result.textContent = `Done. Books added: ${output.booksAdded}. Courses added: ${output.coursesAdded}. Kiddies resources added: ${output.kiddiesAdded}.`;
  }catch(error){
    result.style.background = "#fff1f0";
    result.style.color = "#b42318";
    result.textContent = error.message || "Seeding failed.";
  }
});
</script>
</body>
</html>
