<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credential Review | SpeakOut</title><link rel="icon" href="logo.png">
<link href="css/portal-ui.css" rel="stylesheet"><link href="css/production-ready.css" rel="stylesheet"><link href="css/speakhub-readable.css" rel="stylesheet">
<style>
:root{--navy:#07152b;--blue:#0a5fbf;--green:#0f8f6f;--red:#991b1b;--gold:#f4a21c;--line:#dce6f1;--bg:#f6f9fc;--muted:#536579}
*{box-sizing:border-box}body{margin:0;background:var(--bg)!important}.container{width:min(1180px,92%);margin:auto}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:48px 0}.hero h1{color:#fff;margin:0 0 10px;font-size:clamp(2.2rem,5vw,4rem)}.hero p{color:rgba(255,255,255,.9)!important}
section{padding:30px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.card p{color:var(--muted)!important}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#fff4df;color:#744d00;font-size:.8rem!important;font-weight:900}.pill.verified{background:#e9fbf5;color:var(--green)}.pill.rejected,.pill.resubmission_required{background:#fee2e2;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{padding:14px;border-radius:15px;background:#eaf3ff;color:#155a9f;font-weight:800}.notice.ok{background:#e9fbf5;color:var(--green)}.notice.bad{background:#fee2e2;color:var(--red)}
.footer{background:#061126;color:#fff;padding:28px 0;margin-top:26px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
<script defer src="production-ready.js"></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="nav"><div class="container nav-inner"><a class="brand" href="admin-dashboard.html"><img src="logo.png" alt="SpeakOut"><strong>SpeakOut Admin</strong></a><a class="btn soft" href="admin-dashboard.html">Dashboard</a></div></header>
<section class="hero"><div class="container"><h1>External Credential Review</h1><p>Review provider-issued credentials through the authenticated Platform API. Learners cannot directly create or verify these records in Firestore.</p></div></section>
<main id="main-content"><section><div class="container">
  <div id="statusBox" class="notice">Loading credential submissions...</div>
  <div class="toolbar">
    <button class="btn dark" data-filter="pending" type="button">Needs Review</button>
    <button class="btn soft" data-filter="all" type="button">All</button>
    <button class="btn soft" data-filter="verified" type="button">Verified</button>
    <button class="btn soft" data-filter="rejected" type="button">Rejected / Correction</button>
  </div>
  <div id="grid" class="grid"></div>
</div></section></main>
<footer class="footer"><div class="container">SpeakOut Mental Health Outreach</div></footer>
<script type="module">
import { requireRoles } from "./launch-role-guard.js";
import { adminApi } from "./js/platform-api.js";

let items=[],filter="pending";
const $=id=>document.getElementById(id);
const safe=value=>String(value??"—").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
const normalize=value=>String(value||"").trim().toLowerCase();
const pretty=value=>String(value||"credential").replaceAll("-"," ").replace(/\b\w/g,letter=>letter.toUpperCase());
const safeHref=value=>{try{const url=new URL(String(value||""));return url.protocol==="https:"?url.toString():""}catch{return""}};
function show(message,type=""){statusBox.textContent=message;statusBox.className=`notice ${type}`}
function selected(){
  if(filter==="all")return items;
  if(filter==="pending")return items.filter(item=>["pending","pending_review","submitted"].includes(normalize(item.status)));
  if(filter==="rejected")return items.filter(item=>["rejected","resubmission_required"].includes(normalize(item.status)));
  return items.filter(item=>normalize(item.status)===filter);
}
function render(){
  const rows=selected();
  grid.innerHTML=rows.length?rows.map(item=>{
    const status=normalize(item.status||"pending_review");
    const verify=safeHref(item.verificationUrl),evidence=safeHref(item.evidenceUrl);
    return `<article class="card">
      <span class="pill ${safe(status)}">${safe(pretty(status))}</span>
      <h3>${safe(item.title)}</h3>
      <p><strong>Learner:</strong> ${safe(item.recipientName)}</p>
      <p><strong>Issuer:</strong> ${safe(item.issuer)}</p>
      <p><strong>Reported type:</strong> ${safe(pretty(item.credentialType))}</p>
      <p><strong>Credential number:</strong> ${safe(item.credentialNumber)}</p>
      <p><strong>Issue date:</strong> ${safe(item.issueDate)}</p>
      ${item.notes?`<p><strong>Learner note:</strong> ${safe(item.notes)}</p>`:""}
      ${item.reviewNote?`<p><strong>Review note:</strong> ${safe(item.reviewNote)}</p>`:""}
      <div class="actions">
        ${verify?`<a class="btn soft" target="_blank" rel="noopener noreferrer" href="${safe(verify)}">Provider Verification</a>`:""}
        ${evidence?`<a class="btn soft" target="_blank" rel="noopener noreferrer" href="${safe(evidence)}">Provider Evidence</a>`:""}
        ${["pending","pending_review","submitted"].includes(status)?`
          <button class="btn success" data-action="verified" data-id="${safe(item.id)}">Verify</button>
          <button class="btn gold" data-action="resubmission_required" data-id="${safe(item.id)}">Needs Correction</button>
          <button class="btn danger" data-action="rejected" data-id="${safe(item.id)}">Reject</button>`:""}
      </div>
    </article>`;
  }).join(""):'<div class="card"><h3>No matching credential submissions</h3><p>There is nothing in this review state right now.</p></div>';
  document.querySelectorAll("[data-action]").forEach(button=>button.addEventListener("click",()=>review(button.dataset.id,button.dataset.action)));
}
async function review(recordId,decision){
  const promptText=decision==="verified"?"Optional verification note:":"Reason or correction note for the learner:";
  const note=window.prompt(promptText)||"";
  try{
    show("Updating credential review...");
    await adminApi.reviewCredential(recordId,decision,note);
    await load();
    show(`Credential marked ${pretty(decision)}.`,"ok");
  }catch(error){console.error(error);show(error.message||"Could not update credential review.","bad")}
}
async function load(){
  const result=await adminApi.listCredentials();
  items=result.records||[];
  render();
  show(`${items.length} credential submission(s) loaded securely.`,"ok");
}
document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{
  filter=button.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(item=>item.className="btn soft");
  button.className="btn dark";
  render();
}));
requireRoles(["admin","super_admin"],async()=>{try{await load()}catch(error){console.error(error);show(error.message||"Could not load credential submissions.","bad")}});
</script>
</body>
</html>
