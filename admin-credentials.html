<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credential Review | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--goldSoft:#fff4df;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}.container{width:min(1180px,92%);margin:auto}a{text-decoration:none;color:inherit}.nav{background:#fff;border-bottom:1px solid var(--line)}.nav-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.brand img{width:44px}.brand h2{margin:0;color:var(--blue)}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:10px 15px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.soft{background:var(--soft);color:var(--blue)}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:48px 0}.hero h1{font-size:clamp(2rem,5vw,4rem);margin:0 0 12px}.hero p{color:rgba(255,255,255,.86)}section{padding:32px 0}.notice,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.notice{background:var(--soft);color:var(--blue);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--goldSoft);color:#704800;font-size:.75rem;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.card p{color:var(--muted);line-height:1.5}.footer{background:#061126;color:#fff;padding:30px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.btn{width:100%;border-radius:14px}.actions{flex-direction:column}}
</style></head><body>
<header class="nav"><div class="container nav-inner"><a class="brand" href="admin-dashboard.html"><img src="logo.png"><h2>SpeakOut Admin</h2></a><a class="btn soft" href="admin-dashboard.html">Dashboard</a></div></header>
<section class="hero"><div class="container"><h1>External Credential Review</h1><p>Review provider-issued credentials without changing the original issuer.</p></div></section>
<main><section><div class="container"><div id="statusBox" class="notice">Loading pending credentials...</div><div id="grid" class="grid"></div></div></section></main><footer class="footer"><div class="container">SpeakOut Mental Health Outreach</div></footer>
<script type="module">
import { db } from "./firebase-config.js";import { requireRoles } from "./launch-role-guard.js";import { collection,getDocs,doc,updateDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
let items=[];
function safe(v){return String(v||"—").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function show(m,t=""){statusBox.textContent=m;statusBox.className="notice "+t}
function render(){grid.innerHTML=items.map(x=>`<article class="card"><span class="pill">${safe(x.status||"pending")}</span><h3>${safe(x.title)}</h3><p><b>Learner:</b> ${safe(x.recipientName)}</p><p><b>Issuer:</b> ${safe(x.issuer)}</p><p><b>Type:</b> ${safe((x.credentialType||"credential").replaceAll("-"," "))}</p><p><b>Number:</b> ${safe(x.credentialNumber)}</p><p><b>Issued:</b> ${safe(x.issueDate)}</p><p><b>Notes:</b> ${safe(x.notes)}</p><div class="actions">${x.verificationUrl?`<a class="btn soft" target="_blank" rel="noopener" href="${safe(x.verificationUrl)}">Verify at Provider</a>`:""}${x.evidenceUrl?`<a class="btn soft" target="_blank" rel="noopener" href="${safe(x.evidenceUrl)}">Open Evidence</a>`:""}<button class="btn ok" data-action="verified" data-id="${x.id}">Mark Verified</button><button class="btn bad" data-action="rejected" data-id="${x.id}">Reject</button></div></article>`).join("")||'<div class="card"><h3>No credential submissions</h3><p>There are currently no external credentials to review.</p></div>';document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.action))}
async function setStatus(id,status){const note=prompt(status==="verified"?"Optional verification note:":"Reason / correction note for learner:")||"";await updateDoc(doc(db,"externalCredentials",id),{status,reviewNote:note,reviewedAt:serverTimestamp(),updatedAt:serverTimestamp()});await load();show("Credential status updated.","ok")}
async function load(){const snap=await getDocs(collection(db,"externalCredentials"));items=[];snap.forEach(d=>items.push({id:d.id,...d.data()}));items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render();show(items.length+" credential submission(s) loaded.","ok")}
requireRoles(["admin","super_admin"],async()=>{try{await load()}catch(e){console.error(e);show("Could not load credential submissions.","bad")}});
</script></body></html>
