<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Your School | SpeakOut</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Outfit,sans-serif;
background:#f7f9fc;
color:#07152b;
}

.container{
width:min(900px,92%);
margin:50px auto;
}

.card{
background:#fff;
padding:30px;
border-radius:24px;
box-shadow:0 16px 40px rgba(7,21,43,.08);
}

h1{
margin-top:0;
font-size:clamp(2rem,5vw,4rem);
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

input,select,textarea{
width:100%;
padding:14px;
border:1px solid #dbe3ef;
border-radius:14px;
font-size:15px;
box-sizing:border-box;
}

textarea{
min-height:120px;
resize:vertical;
}

button{
border:0;
background:#0a5fbf;
color:#fff;
padding:16px 24px;
border-radius:999px;
font-weight:900;
cursor:pointer;
margin-top:20px;
}

.notice{
margin-top:20px;
padding:16px;
border-radius:14px;
display:none;
}

.success{
background:#e9fbf5;
color:#0f8f6f;
}

.error{
background:#fee2e2;
color:#991b1b;
}

@media(max-width:700px){
.form-grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Register Your School</h1>

<p>
Complete this form to apply for the SpeakOut School Mental Health Club Program.
Applications are reviewed by SpeakOut before approval.
</p>

<form id="schoolForm">

<div class="form-grid">

<input
type="text"
id="schoolName"
placeholder="School Name"
required>

<select id="schoolType" required>
<option value="">School Type</option>
<option>Primary School</option>
<option>Secondary School</option>
<option>College</option>
<option>University</option>
</select>

<input
type="text"
id="principalName"
placeholder="Principal / Coordinator Name"
required>

<input
type="email"
id="email"
placeholder="School Email"
required>

<input
type="text"
id="phone"
placeholder="Phone Number"
required>

<input
type="text"
id="state"
placeholder="State"
required>

<input
type="text"
id="city"
placeholder="City"
required>

<input
type="number"
id="students"
placeholder="Estimated Students">

</div>

<textarea
id="reason"
placeholder="Why does your school want to join SpeakOut?"
required></textarea>

<button type="submit">
Submit Application
</button>

</form>

<div id="message" class="notice"></div>

</div>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const form = document.getElementById("schoolForm");

const message = document.getElementById("message");

form.addEventListener("submit", async (e)=>{

e.preventDefault();

try{

await addDoc(
collection(db,"schools"),
{
schoolName:
schoolName.value,

schoolType:
schoolType.value,

principalName:
principalName.value,

email:
email.value,

phone:
phone.value,

state:
state.value,

city:
city.value,

estimatedStudents:
Number(students.value||0),

reason:
reason.value,

status:
"pending",

createdAt:
serverTimestamp()
}
);

message.style.display="block";
message.className="notice success";

message.innerHTML=
"Application submitted successfully. SpeakOut will review your application and contact you.";

form.reset();

}catch(error){

console.error(error);

message.style.display="block";
message.className="notice error";

message.innerHTML=
"Application failed. Please try again.";

}

});

</script>

</body>
</html>
