<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>School Approvals</title>
<link href="speakout-style.css" rel="stylesheet"/>
<style>

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.table{
width:100%;
border-collapse:collapse;
}

.table th,
.table td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

.approve{
background:#10b981;
color:white;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
}

.reject{
background:#ef4444;
color:white;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
}

.status{
margin-bottom:20px;
padding:15px;
border-radius:10px;
display:none;
}

.success{
background:#d1fae5;
color:#065f46;
}

.error{
background:#fee2e2;
color:#991b1b;
}

</style>
<link href="css/portal-ui.css" rel="stylesheet"/>
<link href="css/production-ready.css" rel="stylesheet"/><script defer="True" src="production-ready.js"></script><meta content="#123f91" name="theme-color"/></head>
<body><a class="skip-link" href="#main-content">Skip to main content</a>
<div class="container">
<h1>Pending User Approvals</h1>
<div class="status" id="status"></div>
<table class="table">
<thead>
<tr>
<th>Name</th>
<th>Role</th>
<th>Email</th>
<th>School</th>
<th>Action</th>
</tr>
</thead>
<tbody id="approvalTable"></tbody>
</table>
</div>
<script src="school-approvals.js" type="module"></script>
<script defer="" src="portal-ui.js"></script>
</body>
</html>
