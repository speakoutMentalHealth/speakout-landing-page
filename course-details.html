<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Course Details | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--goldSoft:#fff4df;--green:#0f8f6f;--greenSoft:#e9fbf5;--ink:#111827;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10);--r:22px}*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:1000}.nav-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}.brand h2{margin:0;color:var(--blue);font-size:1.05rem}.brand p{margin:0;color:#d98200;font-size:.65rem;font-weight:900}.nav-links{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 14px;border-radius:999px;border:0;font-weight:900;cursor:pointer;font-size:.84rem}.primary{background:var(--blue);color:#fff}.softBtn{background:var(--soft);color:var(--blue)}.gold{background:var(--gold);color:#241300}.dark{background:var(--navy);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:56px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.kicker{background:rgba(255,255,255,.14)}.label{background:var(--soft);color:var(--blue);margin-bottom:14px}h1,h2,h3{line-height:1.05;letter-spacing:-.04em}h1{font-size:clamp(2.3rem,6vw,5rem);margin:16px 0}.hero p{max-width:760px;line-height:1.65;color:rgba(255,255,255,.88)}section{padding:52px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.loading,.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900}.course-head{display:grid;grid-template-columns:280px 1fr;gap:24px}.big-cover{min-height:350px;border-radius:26px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:24px;display:flex;align-items:flex-end;position:relative;overflow:hidden}.big-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.big-cover strong{position:relative;z-index:2;text-shadow:0 4px 18px rgba(0,0,0,.4)}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.pill{padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.68rem;font-weight:900;text-transform:capitalize}.pill.green{background:var(--greenSoft);color:var(--green)}.pill.gold{background:var(--goldSoft);color:#8a5600}.footer{background:#061126;color:rgba(255,255,255,.75);padding:36px 0;margin-top:30px}@media(max-width:900px){.course-head{grid-template-columns:1fr}.nav-links{display:none}.btn{width:100%;border-radius:14px}}</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="portal.html"><img src="logo.png"><div><h2>SpeakOut</h2><p>Learning Portal</p></div></a><nav class="nav-links"><a class="btn softBtn" href="portal.html">Portal</a><a class="btn softBtn" href="speakhub.html">SpeakHub</a><a class="btn dark" href="auth.html">Login</a></nav></div></header><main><section class="hero"><div class="container"><span class="kicker">Course Details</span><h1 id="heroTitle">Loading...</h1><p id="heroDesc"></p></div></section><section><div class="container"><div id="loading" class="loading">Loading course...</div><div id="courseArea" class="course-head" style="display:none"><div class="big-cover" id="courseCover"><strong id="coverText"></strong></div><div class="panel"><span class="label" id="categoryLabel"></span><h2 id="title"></h2><p><strong>Instructor:</strong> <span id="instructor"></span></p><div class="pills" id="pills"></div><p id="description"></p><h3>What You Will Learn</h3><ul id="outcomes"></ul><h3>Course Modules</h3><ol id="moduleList"></ol><div id="actions" style="display:flex;gap:10px;flex-wrap:wrap"></div><div id="premiumNote" class="notice" style="display:none;background:var(--goldSoft);color:#704800">Premium enrollment will be connected later.</div></div></div></div></section></main><footer class="footer"><div class="container">SpeakOut Portal • <a href="portal.html">Back to Portal</a></div></footer><script type="module" src="auth-guard.js"></script><script type="module" src="protected-page-guard.js"></script><script type="module">import{db}from"./firebase-config.js";import{doc,getDoc,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const id=new URLSearchParams(location.search).get("id"),loading=document.getElementById("loading"),area=document.getElementById("courseArea");const pretty=v=>(v||"—").toString().replaceAll("-"," ");const money=i=>(i.accessType||"free")==="free"?"Free":`${i.currency||"₦"}${Number(i.price||0).toLocaleString()}`;async function load(){if(!id){loading.textContent="No course ID provided.";return}try{const s=await getDoc(doc(db,"courses",id));if(!s.exists()){loading.textContent="Course not found.";return}const i={id:s.id,...s.data()};heroTitle.textContent=i.title||"Course Details";heroDesc.textContent=i.shortDescription||i.description||"";title.textContent=i.title||"Untitled";instructor.textContent=i.instructor||"SpeakOut";categoryLabel.textContent=pretty(i.category);description.textContent=i.fullDescription||i.shortDescription||i.description||"No description.";coverText.textContent=i.title||"";if(i.coverUrl)courseCover.innerHTML=`<img src="${i.coverUrl}" alt="${i.title}"><strong>${i.title}</strong>`;const a=i.accessType||"free";pills.innerHTML=`<span class="pill">${pretty(i.category)}</span><span class="pill">${pretty(i.level||"beginner")}</span><span class="pill ${a==="free"?"green":"gold"}">${money(i)}</span>${i.certificateEligible?'<span class="pill gold">Certificate</span>':""}`;const outs=Array.isArray(i.outcomes)?i.outcomes:[];outcomes.innerHTML=outs.length?outs.map(x=>`<li>${x}</li>`).join(""):"<li>Complete the lessons to achieve the course outcomes.</li>";const ms=await getDocs(query(collection(db,"courseModules"),where("courseId","==",id)));let modules=[];ms.forEach(d=>modules.push({id:d.id,...d.data()}));modules.sort((a,b)=>(a.order||0)-(b.order||0));moduleList.innerHTML=modules.length?modules.map(m=>`<li>${m.title}</li>`).join(""):"<li>Modules will appear here after admin adds them.</li>";actions.innerHTML=a==="free"?`<a class="btn primary" href="course-player.html?id=${encodeURIComponent(i.id)}">Start Course</a><a class="btn ghost" href="speakhub.html">Back</a>`:`<button class="btn gold" onclick="alert('Payment unlock coming later.')">Buy / Enroll Later</button><a class="btn softBtn" href="course-player.html?id=${encodeURIComponent(i.id)}&preview=1">Preview</a><a class="btn ghost" href="speakhub.html">Back</a>`;if(a!=="free")premiumNote.style.display="block";loading.style.display="none";area.style.display="grid"}catch(e){console.error(e);loading.textContent="Failed to load course."}}load();</script></body></html>
