<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Users | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--goldSoft:#fff4df;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}.brand h2{margin:0;color:var(--blue);font-size:1.05rem}.brand p{margin:0;color:#d98200;font-size:.62rem;font-weight:900}.links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer;min-height:40px}.primary{background:var(--blue);color:#fff}.soft{background:var(--soft);color:var(--blue)}.gold{background:var(--gold);color:#241300}.dark{background:var(--navy);color:#fff}.danger{background:var(--redSoft);color:var(--red)}.success{background:var(--greenSoft);color:var(--green)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:52px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.72rem;font-weight:900;text-transform:uppercase}.kicker{background:rgba(255,255,255,.14)}.label{background:var(--soft);color:var(--blue);margin-bottom:12px}h1{font-size:clamp(2rem,5vw,4.6rem);line-height:1.05;margin:14px 0}h2,h3{line-height:1.05;color:var(--navy)}.hero p{max-width:850px;color:rgba(255,255,255,.88);line-height:1.65}section{padding:36px 0}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}.card p,.panel p{color:var(--muted);line-height:1.6}.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900;margin-bottom:16px}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.warn{background:var(--goldSoft);color:#704800}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.75rem;font-weight:900;margin:3px}.approved,.active{background:var(--greenSoft);color:var(--green)}.premium,.pending,.pending_school_approval{background:var(--goldSoft);color:#704800}.rejected,.suspended{background:var(--redSoft);color:var(--red)}.stat strong{display:block;color:var(--blue);font-size:2rem}.profile-grid,.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:11px;font:inherit;background:#fbfdff}textarea{min-height:100px;resize:vertical}.photo-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 0 18px}.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--soft);background:#f1f5f9}.photo-help{color:var(--muted);font-size:.88rem;line-height:1.5}.table{width:100%;border-collapse:separate;border-spacing:0 10px}.table th{text-align:left;color:var(--muted);font-size:.8rem;text-transform:uppercase}.table td,.table th{padding:10px}.row{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{background:#061126;color:rgba(255,255,255,.75);padding:34px 0;margin-top:30px}@media(max-width:900px){.g4,.g3,.g2,.profile-grid,.form-grid{grid-template-columns:1fr}.links{display:none}.btn{width:100%;border-radius:14px}.actions{flex-direction:column}.table{font-size:.85rem}}
</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><img src="logo.png"><div><h2>SpeakOut</h2><p>School Users</p></div></a><nav class="links" id="roleNav"></nav></div></header><main><section class="hero"><div class="container"><span class="kicker">School Management</span><h1>School Users</h1><p>Manage school users. This page is restricted to school admins.</p></div></section><section><div class="container"><div id="statusBox" class="notice">Checking access...</div><div class="grid g2"><div class="panel"><span class="label">Add User</span><h2>Add school member</h2><form id="addForm"><div class="form-grid"><input id="firstName" placeholder="First Name" required><input id="lastName" placeholder="Last Name" required><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone"><select id="role" required><option value="">Select Role</option><option value="teacher">Teacher</option><option value="parent">Parent</option><option value="student">Student</option></select><input id="classLevel" placeholder="Class / Department / Notes"></div><textarea id="bio" placeholder="Optional note"></textarea><button class="btn primary" type="submit">Add User</button></form></div><div class="panel"><span class="label">Filter</span><h2>Find users</h2><div class="form-grid"><input id="searchInput" placeholder="Search..."><select id="statusFilter"><option value="all">All Status</option><option value="pending_school_approval">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div></div></div><div class="panel" style="margin-top:18px"><h2>Users</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Student ID</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section></main><footer class="footer"><div class="container">SpeakOut Mental Health Outreach</div></footer><script type="module">import { requireRoles, renderRoleNav } from "./launch-role-guard.js";import { db } from "./firebase-config.js";import { collection,getDocs,query,where,addDoc,doc,updateDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";let SCHOOL=null,USERS=[];const FILTER_ROLE="";function show(m,t=""){statusBox.textContent=m;statusBox.className="notice "+t;}function safe(v){return v||"—";}function pill(v){return `<span class="pill ${(v||"").toLowerCase()}">${safe(v)}</span>`;}function generateStudentId(){return "STU-"+new Date().getFullYear()+"-"+Math.floor(1000+Math.random()*9000);}async function loadUsers(){const snap=await getDocs(query(collection(db,"users"),where("schoolId","==",SCHOOL.id)));USERS=[];snap.forEach(d=>{const u={id:d.id,...d.data()};if(!FILTER_ROLE||u.role===FILTER_ROLE)USERS.push(u);});render();}function render(){const s=searchInput.value.toLowerCase().trim();const sf=statusFilter.value;const filtered=USERS.filter(u=>{const text=`${u.firstName||""} ${u.lastName||""} ${u.email||""} ${u.role||""} ${u.studentId||""}`.toLowerCase();return(!s||text.includes(s))&&(sf==="all"||u.status===sf);});rows.innerHTML=filtered.map(u=>`<tr class="row"><td>${safe(u.firstName)} ${safe(u.lastName)}</td><td>${safe(u.email)}</td><td>${pill(u.role)}</td><td>${safe(u.studentId)}</td><td>${pill(u.status)}</td><td><div class="actions"><button class="btn success" data-id="${u.id}" data-status="approved">Approve</button><button class="btn danger" data-id="${u.id}" data-status="rejected">Reject</button><button class="btn soft" data-id="${u.id}" data-status="pending_school_approval">Pending</button></div></td></tr>`).join("")||"<tr><td colspan='6'>No users found.</td></tr>";rows.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.id),{status:b.dataset.status,updatedAt:serverTimestamp()});show("User updated.","ok");await loadUsers();});}addForm.addEventListener("submit",async e=>{e.preventDefault();const selectedRole=role.value;const userData={firstName:firstName.value.trim(),lastName:lastName.value.trim(),fullName:(firstName.value+" "+lastName.value).trim(),email:email.value.trim(),phone:phone.value.trim(),role:selectedRole,schoolId:SCHOOL.id,schoolCode:SCHOOL.schoolCode||"",schoolName:SCHOOL.schoolName||"",classLevel:classLevel.value.trim(),occupation:classLevel.value.trim(),bio:bio.value.trim(),status:"pending_school_approval",createdBySchool:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()};if(selectedRole==="student")userData.studentId=generateStudentId();await addDoc(collection(db,"users"),userData);addForm.reset();show("User added under this school.","ok");await loadUsers();});[searchInput,statusFilter].forEach(el=>{el.addEventListener("input",render);el.addEventListener("change",render);});requireRoles(["school_admin"],async(user,profile)=>{renderRoleNav(profile,"Users");SCHOOL={id:profile.schoolId,schoolCode:profile.schoolCode,schoolName:profile.schoolName};if(!SCHOOL.id){show("No school linked.","bad");return;}show("School verified.","ok");await loadUsers();});</script></body></html>
