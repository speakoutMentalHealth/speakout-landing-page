<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Seed Legal E-Library</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Outfit,Arial,sans-serif;background:#f7f9fc;color:#111827}.wrap{width:min(780px,92%);margin:60px auto;background:#fff;border:1px solid #e5edf6;border-radius:24px;padding:28px;box-shadow:0 16px 44px rgba(7,21,43,.08)}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1;margin:0 0 14px;color:#07152b}p{color:#637083;line-height:1.65}button{border:0;border-radius:999px;background:#0a5fbf;color:#fff;font-weight:900;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.box{margin-top:16px;padding:14px;border-radius:14px;background:#eaf3ff;color:#0a5fbf;font-weight:800}.warn{background:#fff4df;color:#704800}.ok{background:#e9fbf5;color:#0f8f6f}.bad{background:#fff1f0;color:#b42318}</style></head><body><div class="wrap"><h1>Seed Legal E-Library</h1><p>This installs original SpeakOut guides plus public-domain/open-access reading resources. It avoids fake Google Drive placeholders.</p><button id="seedButton" disabled>Seed Legal E-Library</button><div class="box" id="seedStatus">Checking admin access...</div><div class="box ok" id="seedResult" style="display:none"></div><div class="box warn">After successful seeding, you may remove this page from public hosting.</div></div><script type="module" src="seed-legal-elibrary.js"></script><script type="module">document.getElementById("seedButton").addEventListener("click",async()=>{const r=document.getElementById("seedResult");r.style.display="block";r.className="box ok";r.textContent="Installing legal E-Library resources...";try{const added=await window.seedLegalElibrary();r.textContent=`Done. Added ${added} new E-Library resources.`;}catch(error){r.className="box bad";r.textContent=error.message||"Seeding failed.";}});</script></body></html>
