<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Requests | SpeakOut</title><link rel="icon" href="logo.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#07152b;--blue:#0a5fbf;--soft:#eaf3ff;--gold:#f4a21c;--green:#0f8f6f;--greenSoft:#e9fbf5;--red:#991b1b;--redSoft:#fee2e2;--goldSoft:#fff4df;--muted:#637083;--line:#e5edf6;--bg:#f7f9fc;--shadow:0 18px 44px rgba(7,21,43,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,Arial,sans-serif;background:var(--bg);color:#111827}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px}.brand h2{margin:0;color:var(--blue);font-size:1.05rem}.brand p{margin:0;color:#d98200;font-size:.62rem;font-weight:900}.links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer;min-height:40px}.primary{background:var(--blue);color:#fff}.soft{background:var(--soft);color:var(--blue)}.gold{background:var(--gold);color:#241300}.dark{background:var(--navy);color:#fff}.danger{background:var(--redSoft);color:var(--red)}.success{background:var(--greenSoft);color:var(--green)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero .container{padding:52px 0}.kicker,.label{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.72rem;font-weight:900;text-transform:uppercase}.kicker{background:rgba(255,255,255,.14)}.label{background:var(--soft);color:var(--blue);margin-bottom:12px}h1{font-size:clamp(2rem,5vw,4.6rem);line-height:1.05;margin:14px 0}h2,h3{line-height:1.05;color:var(--navy)}.hero p{max-width:850px;color:rgba(255,255,255,.88);line-height:1.65}section{padding:36px 0}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}.card p,.panel p{color:var(--muted);line-height:1.6}.notice{padding:14px;border-radius:16px;background:var(--soft);color:var(--blue);font-weight:900;margin-bottom:16px}.ok{background:var(--greenSoft);color:var(--green)}.bad{background:var(--redSoft);color:var(--red)}.warn{background:var(--goldSoft);color:#704800}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:.75rem;font-weight:900;margin:3px}.approved,.active{background:var(--greenSoft);color:var(--green)}.pending,.pending_school_approval{background:var(--goldSoft);color:#704800}.rejected,.suspended{background:var(--redSoft);color:var(--red)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:11px;font:inherit;background:#fbfdff}textarea{min-height:95px;resize:vertical}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid var(--soft);background:#f1f5f9}.profile-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.footer{background:#061126;color:rgba(255,255,255,.75);padding:34px 0;margin-top:30px}@media(max-width:900px){.g4,.g3,.g2,.form-grid{grid-template-columns:1fr}.links{display:none}.btn{width:100%;border-radius:14px}}
</style><link rel="stylesheet" href="css/portal-ui.css">
</head>
<body><header class="nav"><div class="container nav-inner"><a class="brand" href="portal.html"><img src="logo.png"><div><h2>SpeakOut</h2><p>Parent Student Link</p></div></a><nav class="links"><a class="btn soft" href="parent-dashboard.html">Parent Dashboard</a><a class="btn soft" href="student-dashboard.html">Student Dashboard</a><a class="btn soft" href="certificate-center.html">Certificates</a><a class="btn dark" href="auth.html">Logout</a></nav></div></header>
<main>
<section class="hero"><div class="container"><span class="kicker">Student Approval</span><h1>Parent Link Requests</h1><p>Approve only parents or guardians you recognize. Reject requests you do not trust.</p></div></section>
<section><div class="container"><div id="statusBox" class="notice">Checking student account...</div><div id="requestGrid" class="grid g2"></div></div></section>
</main><footer class="footer"><div class="container">SpeakOut Parent ↔ Student Linking</div></footer>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { collection, getDocs, query, where, doc, getDoc, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

function show(m,t=""){
  const el=document.getElementById("statusBox");
  if(el){el.textContent=m;el.className="notice "+t;}
}
function safe(v){return v || "—";}
function pill(v){return `<span class="pill ${(v||"").toLowerCase()}">${safe(v)}</span>`;}

let currentUser=null, studentProfile=null;

async function requireStudent(callback){
 onAuthStateChanged(auth,async user=>{
  if(!user){location.href="auth.html";return;}
  const s=await getDoc(doc(db,"users",user.uid));
  if(!s.exists()){show("Profile missing.","bad");return;}
  const p={uid:user.uid,...s.data()};
  const role=(p.role||"").toLowerCase();
  if(role!=="student" && role!=="admin" && role!=="super_admin"){location.href="portal.html";return;}
  currentUser=user; studentProfile=p; callback(user,p);
 });
}

async function loadRequests(){
 const snap=await getDocs(query(collection(db,"parentStudentLinks"),where("studentId","==",currentUser.uid)));
 let html="";
 for(const d of snap.docs){
   const link={id:d.id,...d.data()};
   let parent=null;
   try{const ps=await getDoc(doc(db,"users",link.parentId)); if(ps.exists()) parent=ps.data();}catch(e){}
   html+=`<div class="card"><div class="profile-row"><img class="avatar" src="${parent?.photoData||parent?.photoURL||"logo.png"}" alt=""><div><h3>${parent?.firstName||link.parentName||"Parent"} ${parent?.lastName||""}</h3><p><b>Email:</b> ${parent?.email||link.parentEmail||"—"}</p><p><b>Relationship:</b> ${link.relationship}</p>${pill(link.status)}<div style="margin-top:10px">${link.status==="pending"?`<button class="btn success" data-id="${link.id}" data-status="approved">Approve</button> <button class="btn danger" data-id="${link.id}" data-status="rejected">Reject</button>`:""}</div></div></div></div>`;
 }
 requestGrid.innerHTML=html||"<div class='notice ok'>No parent link requests.</div>";
 requestGrid.querySelectorAll("button[data-id]").forEach(btn=>btn.onclick=async()=>{
   await updateDoc(doc(db,"parentStudentLinks",btn.dataset.id),{status:btn.dataset.status,updatedAt:serverTimestamp()});
   show("Request updated.","ok");
   await loadRequests();
 });
}

requireStudent(async()=>{show("Student account loaded.","ok");await loadRequests();});
</script>
<script src="portal-ui.js" defer></script>
</body></html>
